<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Beast AI</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#fafafa" id="theme-color-meta">
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Inter:wght@400;500;600;700;800&display=swap');
        
        body { background-color: #fafafa; color: #18181b; font-family: 'Inter', sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; transition: background-color 0.3s, color 0.3s; }
        .font-beast-logo { font-family: 'Playfair Display', serif; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #d4d4d8; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #000; }
        
        .dot { display: inline-block; animation: bounce 1.4s infinite ease-in-out both; font-size: 2.5rem; line-height: 0.2; margin-right: 2px; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }

        /* Magical Gemini Aura CSS */
        @keyframes gemini-aura {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .gemini-glow { position: relative; z-index: 1; }
        .gemini-glow::before {
            content: ''; position: absolute; inset: -3px; 
            background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570, #fbbc05, #4285f4);
            background-size: 200% 200%; animation: gemini-aura 3s linear infinite;
            border-radius: 0.6rem; z-index: -1; filter: blur(8px); opacity: 0; transition: opacity 0.3s ease;
        }
        .gemini-glow:focus-within::before { opacity: 0.85; }

        .gemini-text {
            background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570, #fbbc05, #4285f4);
            background-size: 200% 200%; animation: gemini-aura 3s linear infinite;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block;
        }

        /* 🚀 THE DESKTOP SLIDE ANIMATION */
        @media (min-width: 1024px) {
            .desktop-collapsed {
                margin-left: -18rem; 
            }
        }

        /* 🚀 SAFE DARK MODE OVERRIDES (Touches ZERO JS logic) */
        body.dark { background-color: #09090b !important; color: #f4f4f5 !important; }
        body.dark .bg-white { background-color: #18181b !important; border-color: #27272a !important; }
        body.dark .bg-zinc-50 { background-color: #09090b !important; }
        body.dark .text-black, body.dark .text-zinc-900 { color: #f4f4f5 !important; }
        body.dark .border-black, body.dark .border-zinc-200, body.dark .border-zinc-300 { border-color: #27272a !important; }
        body.dark .bg-black { background-color: #f4f4f5 !important; color: #18181b !important; }
        body.dark .text-white { color: #18181b !important; }
        body.dark .text-zinc-400, body.dark .text-zinc-500, body.dark .text-zinc-600 { color: #a1a1aa !important; }
        body.dark .bg-zinc-100 { background-color: #27272a !important; color: #f4f4f5 !important; }
        body.dark .hover\:bg-zinc-800:hover { background-color: #d4d4d8 !important; }
        /* Error States Dark Mode */
        body.dark .bg-red-50 { background-color: #450a0a !important; color: #fca5a5 !important; border-color: #7f1d1d !important;}
        body.dark .text-red-900 { color: #fca5a5 !important; }
        body.dark .border-red-900 { border-color: #7f1d1d !important; }
        body.dark .bg-red-100 { background-color: #7f1d1d !important; color: #fca5a5 !important;}
        /* UI Element fixes */
        body.dark aside, body.dark header, body.dark footer, body.dark textarea { background-color: #18181b !important; border-color: #27272a !important; color: #f4f4f5 !important; }
    </style>
</head>
<body class="flex h-[100dvh] w-full">

    <svg style="width:0;height:0;position:absolute;" aria-hidden="true" focusable="false">
      <linearGradient id="gemini-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#4285f4" />
        <stop offset="33%" stop-color="#9b72cb" />
        <stop offset="66%" stop-color="#d96570" />
        <stop offset="100%" stop-color="#fbbc05" />
      </linearGradient>
    </svg>

    <aside id="sidebar" class="fixed lg:relative top-0 left-0 h-full w-72 bg-white border-r border-zinc-200 p-6 flex flex-col z-40 transition-all duration-300 ease-in-out -translate-x-full lg:translate-x-0">
        <div class="flex items-center justify-between mb-8">
            <span class="font-beast-logo text-xl font-bold uppercase tracking-widest text-black">HISTORY</span>
            <button onclick="clearUnpinned()" class="text-[10px] font-black text-zinc-400 hover:text-red-600 transition uppercase tracking-tighter">Clear All</button>
        </div>
        <button onclick="startNewChat()" class="flex items-center gap-3 bg-black text-white p-4 rounded-lg text-sm font-bold hover:bg-zinc-800 transition mb-6 shadow-md">
            <i data-lucide="plus-circle" class="w-5 h-5"></i> New Session
        </button>
        <nav id="history-list" class="flex-1 space-y-2 overflow-y-auto custom-scrollbar"></nav>
        
        <button onclick="toggleTheme()" class="mt-4 flex items-center gap-3 w-full p-3 border-2 border-zinc-200 rounded-lg text-xs font-bold uppercase tracking-widest hover:bg-zinc-100 transition text-black">
            <i data-lucide="moon" id="theme-icon" class="w-4 h-4"></i> <span id="theme-text">Dark Mode</span>
        </button>
        <div class="border-t pt-4 mt-4 text-[10px] text-zinc-400 font-bold tracking-widest text-center uppercase">Beast Core v10.4</div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 bg-zinc-50 relative">
        <header class="flex items-center justify-center px-6 py-5 bg-white border-b-2 border-black shadow-sm z-10 relative">
            <button onclick="toggleSidebar()" class="absolute left-4 sm:left-6 text-zinc-500 hover:text-black transition-colors z-20">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
            
            <h1 class="text-3xl font-black uppercase tracking-[0.25em] text-black font-beast-logo">Beast Ai</h1>
        </header>

        <main id="scroll-container" class="flex-1 overflow-y-auto p-4 sm:p-8 custom-scrollbar">
            <div class="max-w-3xl mx-auto space-y-8 mt-4">
                <div id="welcome-box" class="w-full max-w-md mx-auto text-center p-8 border-y border-zinc-300 bg-white text-zinc-600 shadow-sm rounded-lg">
                    <span class="italic text-lg tracking-wide font-medium">Welcome to Beast Ai.<br>Pure, unadulterated intelligence.</span>
                </div>
                <div id="chat-box" class="w-full space-y-10 hidden flex-col"></div>
            </div>
        </main>

        <footer class="bg-white border-t-2 border-black p-4 sm:p-6 z-20">
            <div class="max-w-3xl mx-auto flex flex-col gap-4">
                <div class="flex gap-6 px-2">
                    <button id="btn-chat" onclick="setMode('chat')" class="text-xs font-bold uppercase tracking-widest pb-1 border-b-2 border-black text-black">Converse</button>
                    <button id="btn-image" onclick="setMode('image')" class="text-xs font-bold uppercase tracking-widest pb-1 border-b-2 border-transparent text-zinc-400 flex items-center gap-1.5"><i data-lucide="image" class="w-3 h-3"></i> Manifest Image</button>
                </div>
                
                <div id="attachment-preview" class="hidden relative self-start ml-2 mb-2 flex gap-2 overflow-x-auto custom-scrollbar pb-2 max-w-full"></div>
                
                <div class="relative flex items-end w-full gemini-glow">
                    <button onclick="document.getElementById('file-input').click()" class="absolute left-1 sm:left-2 bottom-1.5 sm:bottom-2 p-2 sm:p-3 text-zinc-500 hover:text-black z-10">
                        <i data-lucide="paperclip" class="w-5 h-5"></i>
                    </button>
                    <input type="file" id="file-input" class="hidden" accept="image/*,application/pdf" multiple onchange="handleFile(this)">
                    
                    <textarea id="user-input" rows="1" class="w-full bg-white border-2 border-zinc-200 focus:border-zinc-300 p-3 sm:p-4 pl-10 sm:pl-14 pr-12 sm:pr-16 resize-none outline-none font-semibold text-[15px] rounded-lg relative z-0 transition-colors" placeholder="Speak to the Beast..." onkeydown="handleEnter(event)"></textarea>
                    
                    <button id="send-btn" onclick="sendMessage()" class="absolute right-1 sm:right-2 bottom-1.5 sm:bottom-2 p-2 sm:p-3 bg-black text-white rounded-md hover:bg-zinc-800 transition z-10">
                        <i data-lucide="send" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <script>
        lucide.createIcons();
        let currentMode = 'chat';
        let attachedFiles = [];
        let currentSessionId = null, loadingInterval = null;

        // 🚀 THEME TOGGLE FUNCTION (Saves to memory without breaking anything)
        function toggleTheme() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            localStorage.setItem('beast-theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-icon').setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            document.getElementById('theme-text').innerText = isDark ? 'Light Mode' : 'Dark Mode';
            document.getElementById('theme-color-meta').setAttribute('content', isDark ? '#09090b' : '#fafafa');
            lucide.createIcons();
        }

        // 🚀 Register Service Worker for PWABuilder APK Conversion
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration failed:', err));
        }

        function toggleSidebar() { 
            const sb = document.getElementById('sidebar');
            if (window.innerWidth >= 1024) {
                sb.classList.toggle('desktop-collapsed');
            } else {
                sb.classList.toggle('-translate-x-full');
            }
        }
        
        function handleEnter(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
        function setMode(m) { 
            currentMode = m;
            document.getElementById('btn-chat').className = m === 'chat' ? 'text-xs font-bold uppercase tracking-widest pb-1 border-b-2 border-black text-black' : 'text-xs font-bold uppercase tracking-widest pb-1 border-b-2 border-transparent text-zinc-400 hover:text-zinc-600';
            document.getElementById('btn-image').className = m === 'image' ? 'text-xs font-bold uppercase tracking-widest pb-1 border-b-2 border-black text-black flex items-center gap-1.5' : 'text-xs font-bold uppercase tracking-widest pb-1 border-b-2 border-transparent text-zinc-400 flex items-center gap-1.5 hover:text-zinc-600';
            document.getElementById('user-input').placeholder = m === 'chat' ? "Speak to the Beast..." : "Describe a vision to manifest...";
        }

        async function forceDownload(e, url) {
            e.preventDefault();
            const btn = e.currentTarget;
            btn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Downloading...`;
            lucide.createIcons();

            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = `Beast-Image-${Date.now()}.jpg`;
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);
            } catch (err) {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    canvas.toBlob((b) => {
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(b);
                        a.download = `Beast-Image-${Date.now()}.jpg`;
                        a.click();
                    }, 'image/jpeg');
                };
                img.src = url;
            }
            
            setTimeout(() => {
                btn.innerHTML = `<i data-lucide="download" class="w-4 h-4"></i> Download`;
                lucide.createIcons();
            }, 1000);
        }

        function loadHistory() {
            const list = document.getElementById('history-list'); list.innerHTML = '';
            const keys = Object.keys(localStorage).filter(k => k.startsWith('BeastSession_')).sort().reverse();
            keys.forEach(id => {
                const session = JSON.parse(localStorage.getItem(id));
                const item = document.createElement('div');
                item.className = `group flex items-center justify-between p-3 border rounded-lg cursor-pointer transition ${id === currentSessionId ? 'bg-zinc-100 border-zinc-300 shadow-inner' : 'hover:bg-zinc-50 border-transparent'}`;
                const preview = session.messages?.[0]?.message || "Manifestation";
                item.innerHTML = `<div class="font-bold text-sm truncate text-black flex-1" onclick="loadSession('${id}')">${preview}</div><button onclick="togglePin('${id}', event)" class="ml-2 transition ${session.pinned ? 'text-black' : 'text-zinc-200 group-hover:text-zinc-400'}"><i data-lucide="pin" class="w-3 h-3 ${session.pinned ? 'fill-current' : ''}"></i></button>`;
                list.appendChild(item);
            });
            lucide.createIcons();
        }

        function togglePin(id, e) { e.stopPropagation(); const s = JSON.parse(localStorage.getItem(id)); s.pinned = !s.pinned; localStorage.setItem(id, JSON.stringify(s)); loadHistory(); }
        function clearUnpinned() { if(!confirm("Clear all unpinned chats?")) return; const keys = Object.keys(localStorage).filter(k => k.startsWith('BeastSession_')); keys.forEach(id => { const s = JSON.parse(localStorage.getItem(id)); if(!s.pinned) localStorage.removeItem(id); }); startNewChat(); loadHistory(); }
        
        function loadSession(id) {
            currentSessionId = id; const session = JSON.parse(localStorage.getItem(id));
            document.getElementById('welcome-box').style.display = 'none';
            const chatBox = document.getElementById('chat-box'); chatBox.innerHTML = ''; chatBox.classList.replace('hidden', 'flex');
            session.messages.forEach(m => appendHistoryMessage(m));
            if(window.innerWidth < 1024) document.getElementById('sidebar').classList.add('-translate-x-full'); // Auto-close on mobile when loading chat
            loadHistory();
        }

        function startNewChat() { currentSessionId = null; document.getElementById('chat-box').innerHTML = ''; document.getElementById('chat-box').classList.replace('flex', 'hidden'); document.getElementById('welcome-box').style.display = 'block'; }

        async function compressImage(file, maxWidth = 600) {
            if (file.type === 'application/pdf' || !file.type.startsWith('image/')) return file;
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const scale = Math.min(maxWidth / img.width, 1);
                    canvas.width = img.width * scale; canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob((blob) => { resolve(new File([blob], file.name, { type: 'image/jpeg' })); }, 'image/jpeg', 0.4); 
                };
                img.src = URL.createObjectURL(file);
            });
        }

        async function sendMessage() {
            const input = document.getElementById('user-input'); const msg = input.value.trim();
            if (!msg && attachedFiles.length === 0) return;
            input.value = ''; if (!currentSessionId) currentSessionId = "BeastSession_" + Date.now();
            
            document.getElementById('welcome-box').style.display = 'none';
            const chatBox = document.getElementById('chat-box'); chatBox.classList.replace('hidden', 'flex');
            document.getElementById('send-btn').disabled = true;

            const currentFilesSnapshot = attachedFiles.map(f => ({ name: f.name, isPdf: f.isPdf, preview: f.preview }));
            let userHtml = `
            <div class="flex flex-col items-end ml-auto max-w-[85%]">
                <div class="flex items-center gap-2 mb-2 text-zinc-500">
                    <span class="text-xs font-bold uppercase tracking-widest text-zinc-400">You</span>
                    <i data-lucide="user" class="w-4 h-4 text-zinc-400"></i>
                </div>
                <div class="bg-black text-white p-5 shadow-lg rounded-2xl rounded-tr-sm text-[15px] font-medium leading-relaxed flex flex-col gap-3 items-end">`;
            
            if (currentFilesSnapshot.length > 0) {
                userHtml += `<div class="flex flex-wrap gap-2 justify-end">`;
                currentFilesSnapshot.forEach(f => {
                    if (f.isPdf) { userHtml += `<div class="px-3 py-2 bg-red-900/80 rounded border border-red-500 text-xs font-bold flex items-center gap-2"><i data-lucide="file-text" class="w-4 h-4"></i> ${f.name}</div>`; }
                    else { userHtml += `<img src="${f.preview}" class="max-h-32 rounded border border-zinc-700">`; }
                });
                userHtml += `</div>`;
            }
            if (msg) userHtml += `<span>${msg}</span>`;
            userHtml += `</div></div>`;
            chatBox.insertAdjacentHTML('beforeend', userHtml);

            const msgId = Date.now();
            const beastHtml = `
                <div class="flex flex-col items-start w-full max-w-prose">
                    <div class="flex items-center gap-2 mb-2">
                        <i data-lucide="sparkles" class="w-4 h-4 ${currentMode === 'image' ? 'animate-pulse' : ''}" style="stroke: url(#gemini-gradient);"></i>
                        <span class="text-xs font-bold uppercase tracking-widest gemini-text">${currentMode === 'image' ? 'Beast is manifesting' : 'Beast is thinking'}</span>
                    </div>
                    <div id="beast-box-${msgId}" class="bg-white border border-zinc-200 p-6 sm:p-8 shadow-sm w-full rounded-2xl rounded-tl-sm text-[15px] font-medium leading-relaxed prose prose-zinc prose-sm break-words overflow-x-hidden transition-colors">
                        <div id="loader-${msgId}" class="flex items-center justify-between w-full"><div class="flex items-end h-6 text-zinc-900"><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div><span id="percent-${msgId}" class="text-xs font-mono font-bold text-zinc-500 bg-zinc-100 px-3 py-1.5 rounded">0%</span></div>
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', beastHtml);
            lucide.createIcons(); document.getElementById('scroll-container').scrollTop = document.getElementById('scroll-container').scrollHeight;

            let p = 0; const pEl = document.getElementById(`percent-${msgId}`);
            loadingInterval = setInterval(() => { p += Math.floor(Math.random() * 8 + 2); if (p > 99) p = 99; if(pEl) pEl.innerText = p + "%"; }, 300);

            const formData = new FormData(); formData.append('message', msg); formData.append('mode', currentMode);
            
            let session = JSON.parse(localStorage.getItem(currentSessionId)) || { pinned: false, messages: [] };
            let chatHistory = session.messages.slice(-100).map(m => ({ type: m.type, message: m.message || "" }));
            formData.append('history', JSON.stringify(chatHistory));

            for (let i = 0; i < attachedFiles.length; i++) { formData.append('files', await compressImage(attachedFiles[i].file)); }
            clearAllAttachments();

            try {
                const res = await fetch('/api/chat', { method: 'POST', body: formData });
                const data = await res.json();
                
                const targetBox = document.getElementById(`beast-box-${msgId}`);
                let replyText = data.reply || "Connection severed. Vercel timeout exceeded! ⏱️😵";
                
                if (replyText.includes("resting") || replyText.includes("offline") || replyText.includes("severed") || replyText.includes("SYSTEM FAILURE")) {
                    clearInterval(loadingInterval);
                    targetBox.classList.replace('bg-white', 'bg-red-50'); targetBox.classList.replace('border-zinc-200', 'border-red-900'); targetBox.classList.add('text-red-900');
                    targetBox.innerHTML = marked.parse(replyText);
                } 
                else if (currentMode === 'image' && (replyText.startsWith('http') || replyText.startsWith('data:'))) {
                    const img = new Image();
                    img.onload = () => {
                        clearInterval(loadingInterval);
                        targetBox.innerHTML = `
                        <div class="flex flex-col items-center gap-4 w-full">
                            <img src="${replyText}" class="max-w-full max-h-[450px] w-auto object-contain border-4 border-black rounded shadow-lg">
                            <button onclick="forceDownload(event, '${replyText}')" class="px-5 py-2.5 bg-black text-white text-xs font-bold uppercase tracking-widest rounded-md flex items-center gap-2 transition hover:bg-zinc-800">
                                <i data-lucide="download" class="w-4 h-4"></i> Download
                            </button>
                        </div>`;
                        lucide.createIcons(); document.getElementById('scroll-container').scrollTop = document.getElementById('scroll-container').scrollHeight;
                    };
                    img.onerror = () => {
                        clearInterval(loadingInterval); targetBox.innerHTML = marked.parse("Failed to load the manifested image! 😵");
                    };
                    img.src = replyText; 
                } else {
                    clearInterval(loadingInterval);
                    targetBox.innerHTML = marked.parse(replyText);
                    targetBox.querySelectorAll('pre').forEach(pre => pre.classList.add('bg-zinc-900', 'text-zinc-100', 'p-4', 'rounded-lg', 'overflow-x-auto', 'my-4'));
                }
                
                const headerElement = targetBox.previousElementSibling;
                headerElement.innerHTML = `<i data-lucide="sparkles" class="w-4 h-4"></i><span class="text-xs font-bold uppercase tracking-widest">Beast</span>`;
                lucide.createIcons();

                session.messages.push({type:'user', message:msg, files: currentFilesSnapshot}, {type:'beast', message:replyText, mode: currentMode});
                localStorage.setItem(currentSessionId, JSON.stringify(session));
                
            } catch(e) { 
                clearInterval(loadingInterval);
                document.getElementById(`beast-box-${msgId}`).innerHTML = marked.parse("The connection was severed! ⚡😵"); 
                document.getElementById(`beast-box-${msgId}`).classList.replace('bg-white', 'bg-red-50'); document.getElementById(`beast-box-${msgId}`).classList.add('text-red-900');
            }
            
            lucide.createIcons(); document.getElementById('send-btn').disabled = false;
            document.getElementById('scroll-container').scrollTop = document.getElementById('scroll-container').scrollHeight; loadHistory();
        }

        function appendHistoryMessage(m) {
            const chatBox = document.getElementById('chat-box');
            if (m.type === 'user') {
                let inner = `
                <div class="flex flex-col items-end ml-auto max-w-[85%]">
                    <div class="flex items-center gap-2 mb-2 text-zinc-500">
                        <span class="text-xs font-bold uppercase tracking-widest text-zinc-400">You</span>
                        <i data-lucide="user" class="w-4 h-4 text-zinc-400"></i>
                    </div>
                    <div class="bg-black text-white p-5 shadow-lg rounded-2xl rounded-tr-sm text-[15px] font-medium leading-relaxed flex flex-col gap-3 items-end">`;
                if (m.files && m.files.length > 0) {
                    inner += `<div class="flex flex-wrap gap-2 justify-end">`;
                    m.files.forEach(f => {
                        if (f.isPdf) { inner += `<div class="px-3 py-2 bg-red-900/80 rounded border border-red-500 text-xs font-bold flex items-center gap-2"><i data-lucide="file-text" class="w-4 h-4"></i> ${f.name}</div>`; } 
                        else { inner += `<img src="${f.preview}" class="max-h-32 rounded border border-zinc-700">`; }
                    });
                    inner += `</div>`;
                }
                if (m.message) inner += `<span>${m.message}</span>`;
                chatBox.insertAdjacentHTML('beforeend', inner + `</div></div>`);
            } else {
                let boxClass = "bg-white border-zinc-200 text-zinc-900";
                if (m.message.includes("resting") || m.message.includes("offline") || m.message.includes("severed") || m.message.includes("SYSTEM FAILURE")) boxClass = "bg-red-50 border-red-900 text-red-900";
                let contentHtml = "";
                if (m.mode === 'image' && (m.message.startsWith('http') || m.message.startsWith('data:'))) {
                    contentHtml = `
                    <div class="flex flex-col items-center gap-4 w-full">
                        <img src="${m.message}" class="max-w-full max-h-[450px] w-auto object-contain border-4 border-black rounded shadow-lg">
                        <button onclick="forceDownload(event, '${m.message}')" class="px-5 py-2.5 bg-black text-white text-xs font-bold uppercase tracking-widest rounded-md flex items-center gap-2 transition hover:bg-zinc-800">
                            <i data-lucide="download" class="w-4 h-4"></i> Download
                        </button>
                    </div>`;
                } else { contentHtml = marked.parse(m.message); }
                const html = `<div class="flex flex-col items-start w-full max-w-prose"><div class="flex items-center gap-2 mb-2 text-black"><i data-lucide="sparkles" class="w-4 h-4"></i><span class="text-xs font-bold uppercase tracking-widest">Beast</span></div><div class="border ${boxClass} p-6 sm:p-8 shadow-sm w-full rounded-2xl rounded-tl-sm text-[15px] font-medium leading-relaxed prose prose-sm break-words overflow-x-hidden">${contentHtml}</div></div>`;
                chatBox.insertAdjacentHTML('beforeend', html);
                chatBox.querySelectorAll('pre').forEach(pre => pre.classList.add('bg-zinc-900', 'text-zinc-100', 'p-4', 'rounded-lg', 'overflow-x-auto', 'my-4'));
            }
        }

        function handleFile(inputElement) { 
            const newFiles = Array.from(inputElement.files);
            if (attachedFiles.length + newFiles.length > 20) { alert("The Beast can process a max of 20 files! 🦖"); return; }
            newFiles.forEach(file => {
                const isPdf = file.type === 'application/pdf'; const reader = new FileReader();
                reader.onload = (e) => { attachedFiles.push({ file: file, preview: isPdf ? null : e.target.result, isPdf: isPdf, name: file.name }); renderAttachmentPreviews(); };
                reader.readAsDataURL(file);
            });
            inputElement.value = ''; 
        }

        function renderAttachmentPreviews() {
            const container = document.getElementById('attachment-preview'); container.innerHTML = '';
            if (attachedFiles.length === 0) { container.classList.replace('flex', 'hidden'); return; }
            container.classList.replace('hidden', 'flex');
            attachedFiles.forEach((f, index) => {
                const div = document.createElement('div'); div.className = "relative flex-shrink-0 inline-block";
                if (f.isPdf) { div.innerHTML = `<div class="h-16 w-16 bg-red-100 border-2 border-red-900 rounded flex items-center justify-center text-xs font-bold text-red-900 shadow-sm p-1 text-center overflow-hidden break-all leading-tight"><i data-lucide="file-text" class="w-4 h-4 mx-auto mb-1"></i>PDF</div>`; } 
                else { div.innerHTML = `<img src="${f.preview}" class="h-16 w-auto border-2 border-black rounded shadow-sm object-cover">`; }
                div.innerHTML += `<button onclick="removeSpecificAttachment(${index})" class="absolute -top-2 -right-2 bg-black text-white p-1 rounded-full hover:bg-red-600 transition shadow-md z-10"><i data-lucide="x" class="w-3 h-3"></i></button>`;
                container.appendChild(div);
            });
            lucide.createIcons();
        }
        function removeSpecificAttachment(index) { attachedFiles.splice(index, 1); renderAttachmentPreviews(); }
        function clearAllAttachments() { attachedFiles = []; document.getElementById('file-input').value = ''; renderAttachmentPreviews(); }
        
        // 🚀 Checks memory for Dark Mode on startup
        window.onload = () => { 
            if(localStorage.getItem('beast-theme') === 'dark') { toggleTheme(); }
            loadHistory(); 
        };
    </script>
</body>
</html>
