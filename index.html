<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Beast AI</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');
        body { background-color: #fafafa; color: #18181b; overflow-x: hidden; font-family: 'Inter', sans-serif; }
        .font-playfair { font-family: 'Playfair Display', serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #d4d4d8; border-radius: 0px; }
        .dot { display: inline-block; animation: bounce 1.4s infinite ease-in-out both; font-size: 2rem; color: #000; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }
        .gemini-text { -webkit-font-smoothing: antialiased; }
    </style>
</head>
<body class="bg-zinc-50 text-zinc-900 flex h-[100dvh] overflow-hidden">

    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-zinc-50 border-r border-zinc-200 p-4 pt-6 flex flex-col z-30 -translate-x-full lg:translate-x-0 transition-transform lg:relative shrink-0">
        <div class="flex items-center justify-between mb-8 px-2 mt-2">
            <span class="font-playfair text-xl font-bold uppercase tracking-[0.2em] text-black text-center w-full">HISTORY</span>
            <button onclick="toggleSidebar()" class="lg:hidden text-zinc-400 hover:text-black outline-none"><i data-lucide="x" class="w-6 h-6"></i></button>
        </div>
        <button onclick="startNewChat()" class="flex items-center gap-3 bg-white border border-zinc-200 hover:bg-zinc-100 text-black px-4 py-3 rounded-lg text-sm mb-6 shadow-sm font-semibold transition-colors gemini-text">
            <i data-lucide="plus-circle" class="w-5 h-5"></i> New Session
        </button>
        <nav id="history-list" class="flex-1 space-y-2 overflow-y-auto pr-2 text-sm text-zinc-700 custom-scrollbar gemini-text"></nav>
        
        <div class="text-center text-[10px] text-zinc-400 font-bold tracking-widest uppercase gemini-text mt-auto mb-3">BEAST CORE v1.0 (Legacy)</div>
    </aside>

    <div class="flex-1 flex flex-col h-full w-full relative min-w-0">
        <header class="flex items-center justify-center px-6 py-4 bg-white border-b-2 border-black shadow-sm z-10 shrink-0 relative">
            <button onclick="toggleSidebar()" class="absolute left-4 lg:hidden text-zinc-400 hover:text-black transition"><i data-lucide="menu" class="w-6 h-6"></i></button>
            <h1 class="text-2xl sm:text-3xl font-black uppercase tracking-[0.25em] text-black font-playfair">Beast Ai</h1>
        </header>

        <main id="scroll-container" class="flex-1 overflow-y-auto p-4 sm:p-8 bg-zinc-50 pb-10 custom-scrollbar">
            <div class="max-w-3xl mx-auto space-y-8 mt-2">
                <div id="welcome-box" class="w-full max-w-md mx-auto text-center p-6 border-y border-zinc-300 bg-white text-zinc-600">
                    <span class="font-playfair italic text-lg tracking-wide">Welcome to Beast Ai.<br>Pure, unadulterated intelligence.</span>
                </div>
                <div id="chat-box" class="w-full space-y-8 hidden flex-col"></div>
                
                <div id="loading-indicator" class="hidden flex-col items-start w-full max-w-prose mt-4">
                    <div class="flex items-end mb-1"><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
                </div>
            </div>
        </main>

        <footer class="w-full bg-white border-t-2 border-black z-20 p-3 sm:p-6 shrink-0">
            <div class="max-w-3xl mx-auto flex flex-col gap-4">
                <div class="relative flex items-end w-full">
                    <textarea id="user-input" rows="1" class="w-full bg-zinc-50 border-2 border-zinc-200 focus:border-black p-3 pr-14 resize-none outline-none text-[15px] rounded-lg min-h-[52px]" placeholder="Speak to the Beast..." onkeydown="handleEnter(event)"></textarea>
                    <button onclick="sendMessage()" id="send-btn" class="absolute right-2 bottom-2 p-2 bg-black text-white rounded-md hover:bg-zinc-800 transition-colors"><i data-lucide="send" class="w-5 h-5"></i></button>
                </div>
            </div>
        </footer>
    </div>

    <script>
        lucide.createIcons();

        let currentSessionId = null;

        // --- CORE CHAT LOGIC ---
        function startNewChat() { 
            currentSessionId = null; 
            document.getElementById('chat-box').innerHTML = ''; 
            document.getElementById('chat-box').classList.replace('flex', 'hidden'); 
            document.getElementById('welcome-box').style.display = 'block'; 
            if(window.innerWidth < 1024) toggleSidebar(); 
            loadHistory();
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }
        function handleEnter(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
        function scrollToBottom() { const c = document.getElementById('scroll-container'); c.scrollTop = c.scrollHeight; }

        function loadHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            const sessions = Object.keys(localStorage).filter(k => k.startsWith('Beast_Session_')).sort().reverse();
            
            sessions.forEach(id => {
                const data = JSON.parse(localStorage.getItem(id));
                const item = document.createElement('div');
                item.className = "p-3 hover:bg-zinc-100 cursor-pointer text-xs truncate font-semibold border-b border-zinc-100 transition-colors rounded-lg";
                item.innerText = data[0]?.message.substring(0, 30) || "New Chat";
                item.onclick = () => loadSession(id);
                list.appendChild(item);
            });
        }

        function loadSession(id) {
            currentSessionId = id;
            const data = JSON.parse(localStorage.getItem(id));
            const chatBox = document.getElementById('chat-box'); 
            chatBox.innerHTML = '';
            chatBox.classList.replace('hidden', 'flex'); 
            document.getElementById('welcome-box').style.display = 'none';
            data.forEach(m => appendToUI(m.message, m.type));
            if(window.innerWidth < 1024) toggleSidebar();
            scrollToBottom();
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const msg = input.value.trim();
            if (!msg) return;
            input.value = '';

            if (!currentSessionId) currentSessionId = "Beast_Session_" + Date.now();
            
            document.getElementById('welcome-box').style.display = 'none';
            document.getElementById('chat-box').classList.replace('hidden', 'flex');
            appendToUI(msg, 'user');
            scrollToBottom();

            document.getElementById('loading-indicator').classList.replace('hidden', 'flex');

            const formData = new FormData();
            formData.append('message', msg);
            formData.append('mode', 'chat');

            try {
                const res = await fetch('/api/chat', { method: 'POST', body: formData });
                const data = await res.json();
                document.getElementById('loading-indicator').classList.replace('flex', 'hidden');
                
                appendToUI(data.reply, 'beast');
                
                // SAVE TO LOCAL STORAGE
                let history = JSON.parse(localStorage.getItem(currentSessionId)) || [];
                history.push({type: 'user', message: msg}, {type: 'beast', message: data.reply});
                localStorage.setItem(currentSessionId, JSON.stringify(history));
                loadHistory();

            } catch (e) {
                document.getElementById('loading-indicator').classList.replace('flex', 'hidden');
                appendToUI("The connection to the Beast was severed.", 'beast');
            }
            scrollToBottom();
        }

        function appendToUI(m, type) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            if (type === 'user') {
                div.className = "flex flex-col items-end ml-auto max-w-[85%] mb-6";
                div.innerHTML = `<div class="bg-black text-white p-4 shadow-lg rounded-2xl rounded-tr-sm leading-relaxed text-[15px]">${m}</div>`;
            } else {
                div.className = "flex flex-col items-start w-full max-w-prose mb-6";
                div.innerHTML = `<div class="flex items-center gap-2 mb-2"><i data-lucide="sparkles" class="w-4 h-4"></i><span class="text-xs font-bold uppercase">Beast</span></div><div class="bg-white border border-zinc-200 p-6 shadow-sm w-full rounded-2xl rounded-tl-sm leading-loose text-zinc-900 prose prose-zinc prose-sm">${marked.parse(m)}</div>`;
            }
            chatBox.appendChild(div);
            lucide.createIcons();
        }

        // Initial Load
        loadHistory();
    </script>
</body>
</html>
