<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Beast AI</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Inter:wght@400;500;600;700;800&display=swap');
        
        /* THEME VARIABLES */
        :root { --bg: #fafafa; --text: #18181b; --card: #ffffff; --border: #e4e4e7; }
        .dark { --bg: #09090b; --text: #f4f4f5; --card: #18181b; --border: #27272a; }
        
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; transition: background 0.3s, color 0.3s; }
        .bg-custom { background-color: var(--bg); }
        .bg-card { background-color: var(--card); border: 1px solid var(--border); }
        .font-beast-logo { font-family: 'Playfair Display', serif; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #d4d4d8; border-radius: 4px; }
        
        /* Aura Effects */
        @keyframes gemini-aura { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .gemini-text { background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570, #fbbc05, #4285f4); background-size: 200% 200%; animation: gemini-aura 3s linear infinite; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="flex h-[100dvh] w-full">

    <aside id="sidebar" class="fixed lg:relative top-0 left-0 h-full w-72 bg-card border-r border-[var(--border)] p-6 flex flex-col z-40 transition-all duration-300 -translate-x-full lg:translate-x-0">
        <div class="flex items-center justify-between mb-8">
            <span class="font-beast-logo text-xl font-bold uppercase tracking-widest">HISTORY</span>
            <button onclick="clearUnpinned()" class="text-[10px] font-black text-zinc-400 hover:text-red-600 transition uppercase">Clear All</button>
        </div>
        <button onclick="startNewChat()" class="flex items-center gap-3 bg-[var(--text)] text-[var(--bg)] p-4 rounded-lg text-sm font-bold transition mb-6 shadow-md">
            <i data-lucide="plus-circle" class="w-5 h-5"></i> New Session
        </button>
        <nav id="history-list" class="flex-1 space-y-2 overflow-y-auto custom-scrollbar"></nav>
        
        <button onclick="toggleTheme()" class="mt-4 flex items-center gap-3 w-full p-3 bg-[var(--border)] rounded-lg text-xs font-bold uppercase tracking-widest hover:opacity-80 transition">
            <i data-lucide="moon" id="theme-icon" class="w-4 h-4"></i> <span id="theme-text">Toggle Theme</span>
        </button>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 bg-custom relative">
        <header class="flex items-center justify-center px-6 py-5 bg-card border-b border-[var(--border)] z-10 relative">
            <button onclick="toggleSidebar()" class="absolute left-4 text-[var(--text)] hover:opacity-70 transition-colors z-20">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
            <h1 class="text-3xl font-black uppercase tracking-[0.25em] font-beast-logo">Beast Ai</h1>
        </header>

        <main id="scroll-container" class="flex-1 overflow-y-auto p-4 sm:p-8 custom-scrollbar">
            <div class="max-w-3xl mx-auto space-y-8 mt-4">
                <div id="welcome-box" class="w-full max-w-md mx-auto text-center p-8 bg-card shadow-sm rounded-lg border border-[var(--border)]">
                    <span class="italic text-lg tracking-wide font-medium">Welcome to Beast Ai.<br>Pure, unadulterated intelligence.</span>
                </div>
                <div id="chat-box" class="w-full space-y-10 hidden flex-col"></div>
            </div>
        </main>

        <footer class="bg-card border-t border-[var(--border)] p-4 sm:p-6 z-20">
            <div class="max-w-3xl mx-auto flex flex-col gap-4">
                <div class="relative flex items-end w-full">
                    <textarea id="user-input" rows="1" class="w-full bg-[var(--bg)] border border-[var(--border)] p-4 pr-16 resize-none outline-none font-semibold text-[15px] rounded-lg transition-colors" placeholder="Speak to the Beast..." onkeydown="handleEnter(event)"></textarea>
                    <button id="send-btn" onclick="sendMessage()" class="absolute right-2 bottom-2 p-3 bg-[var(--text)] text-[var(--bg)] rounded-md transition"><i data-lucide="send" class="w-5 h-5"></i></button>
                </div>
            </div>
        </footer>
    </div>

    <script>
        lucide.createIcons();
        
        // 🚀 THEME LOGIC
        function toggleTheme() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            localStorage.setItem('beast-theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-icon').setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            document.getElementById('theme-text').innerText = isDark ? 'Light Mode' : 'Dark Mode';
            lucide.createIcons();
        }
        
        // Initialize theme on load
        if (localStorage.getItem('beast-theme') === 'dark') {
            document.body.classList.add('dark');
            document.getElementById('theme-icon').setAttribute('data-lucide', 'sun');
            document.getElementById('theme-text').innerText = 'Light Mode';
        }

        // ... (Keep the rest of your sendMessage, loadHistory, etc. functions here as they were) ...
        // Note: Just ensure your `appendHistoryMessage` uses the same classes like 'bg-card' and 'border-[var(--border)]' to match the theme!
        
        window.onload = () => { loadHistory(); lucide.createIcons(); };
    </script>
</body>
</html>
