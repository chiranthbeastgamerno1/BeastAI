<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Beast AI</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');
        
        body { background-color: #fafafa; color: #18181b; overflow-x: hidden; font-family: 'Inter', sans-serif; }
        .font-playfair { font-family: 'Playfair Display', serif; }
        .no-select { -webkit-user-select: none; user-select: none; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #d4d4d8; border-radius: 0px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #000000; }
        
        .dot { display: inline-block; animation: bounce 1.4s infinite ease-in-out both; font-size: 2rem; line-height: 0; color: #000; margin-right: 2px;}
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }
        
        #sidebar { transition: transform 0.3s ease-in-out; }
        .gemini-text { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    </style>
</head>
<body class="bg-zinc-50 text-zinc-900 selection:bg-black selection:text-white flex h-[100dvh] overflow-hidden">

    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-zinc-50 border-r border-zinc-200 p-4 pt-6 flex flex-col z-30 -translate-x-full lg:translate-x-0 transition-transform lg:relative shrink-0">
        <div class="flex items-center justify-between mb-8 px-2 mt-2">
            <span class="font-playfair text-xl font-bold uppercase tracking-[0.2em] text-black">HISTORY</span>
            <button onclick="toggleSidebar()" class="lg:hidden text-zinc-400 hover:text-black outline-none"><i data-lucide="x" class="w-6 h-6"></i></button>
        </div>
        <button onclick="startNewChat()" class="flex items-center gap-3 bg-white border border-zinc-200 hover:bg-zinc-100 text-black px-4 py-3 rounded-lg text-sm mb-6 shadow-sm font-semibold transition-colors gemini-text">
            <i data-lucide="plus-circle" class="w-5 h-5"></i> New Session
        </button>
        <nav id="history-list" class="flex-1 space-y-2 overflow-y-auto pr-2 text-sm text-zinc-700 custom-scrollbar gemini-text"></nav>
        <div class="border-t border-zinc-200 pt-4 mt-auto text-center text-xs text-zinc-400 font-bold tracking-widest uppercase gemini-text">BEAST CORE v4.6</div>
    </aside>

    <div class="flex-1 flex flex-col h-full w-full relative min-w-0">
        
        <header class="flex items-center justify-center px-6 py-4 bg-white border-b-2 border-black shadow-sm z-10 shrink-0 relative">
            <button onclick="toggleSidebar()" class="absolute left-4 lg:hidden text-zinc-400 hover:text-black transition"><i data-lucide="menu" class="w-6 h-6"></i></button>
            <div class="text-center">
                <h1 class="text-2xl sm:text-3xl font-black uppercase tracking-[0.25em] text-black font-playfair">Beast Ai</h1>
                <div class="w-12 h-1 bg-black mx-auto mt-1 sm:mt-2"></div>
            </div>
        </header>

        <main id="scroll-container" class="flex-1 overflow-y-auto p-4 sm:p-8 custom-scrollbar bg-zinc-50 pb-10">
            <div class="max-w-3xl mx-auto space-y-8 sm:space-y-10 mt-2 sm:mt-4">
                
                <div id="welcome-box" class="w-full max-w-md mx-auto text-center p-6 sm:p-8 border-y border-zinc-300 bg-white text-zinc-600 transition-opacity duration-500">
                    <span class="whitespace-pre-wrap font-playfair italic text-base sm:text-lg tracking-wide">Welcome to Beast Ai.<br>Pure, unadulterated intelligence.</span>
                </div>

                <div id="chat-box" class="w-full space-y-8 sm:space-y-10 hidden flex-col"></div>
                
                <div id="loading-indicator" class="hidden flex-col items-start w-full max-w-prose mt-4">
                    <div class="flex items-center gap-2 mb-2 text-black gemini-text">
                        <i data-lucide="sparkles" class="w-4 h-4 animate-pulse"></i>
                        <span id="loading-status" class="text-xs uppercase tracking-widest font-bold">Beast is thinking</span>
                    </div>
                    <div class="bg-white border border-zinc-200 p-4 sm:p-6 w-full shadow-sm flex items-center justify-between rounded-lg">
                        <div class="flex items-end mb-1"><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
                        <span id="loading-percent" class="text-xs font-mono font-bold text-zinc-500 bg-zinc-100 px-2 py-1 rounded">0%</span>
                    </div>
                </div>
            </div>
        </main>

        <footer class="w-full bg-white border-t-2 border-black z-20 p-3 sm:p-6 shrink-0 pb-safe">
            <div class="max-w-3xl mx-auto flex flex-col gap-3 sm:gap-4">
                
                <div id="attachment-preview" class="hidden relative self-start inline-block mb-1 ml-2">
                    <img id="preview-img" src="" class="h-16 sm:h-20 w-auto border-2 border-black shadow-sm object-cover rounded">
                    <button onclick="clearAttachment()" class="absolute -top-2 -right-2 bg-black text-white p-1 rounded-full hover:bg-red-600 shadow-md transition-colors"><i data-lucide="x" class="w-3 h-3"></i></button>
                </div>

                <div class="flex items-center gap-4 sm:gap-6 px-2 no-select gemini-text overflow-x-auto">
                    <button onclick="setMode('chat')" id="btn-converse" class="text-xs font-bold uppercase tracking-widest pb-1 border-b-2 border-black text-black transition-all whitespace-nowrap">Converse</button>
                    <button onclick="setMode('image')" id="btn-manifest" class="text-xs font-bold uppercase tracking-widest pb-1 border-b-2 border-transparent text-zinc-400 hover:text-zinc-600 transition-all flex items-center gap-1.5 whitespace-nowrap">
                        <i data-lucide="image" class="w-4 h-4"></i> Manifest Image
                    </button>
                </div>
                
                <div class="relative flex items-end w-full">
                    <button type="button" onclick="document.getElementById('file-input').click()" class="absolute left-2 bottom-2 p-2 sm:p-3 text-zinc-400 hover:text-black transition-colors z-10"><i data-lucide="paperclip" class="w-5 h-5"></i></button>
                    <input type="file" id="file-input" class="hidden" accept="image/*" onchange="handleFile(this)">
                    <textarea id="user-input" rows="1" class="w-full bg-zinc-50 border-2 border-zinc-200 focus:border-black focus:ring-0 transition-colors p-3 sm:p-4 pl-12 sm:pl-14 pr-14 sm:pr-16 resize-none outline-none gemini-text text-[15px] font-medium text-black placeholder:text-zinc-400 rounded-lg custom-scrollbar min-h-[52px] sm:min-h-[64px] max-h-32 sm:max-h-40" placeholder="Speak to the Beast..." onkeydown="handleEnter(event)"></textarea>
                    <button onclick="sendMessage()" id="send-btn" class="absolute right-2 bottom-2 p-2 sm:p-3 bg-black text-white hover:bg-zinc-800 disabled:bg-zinc-300 disabled:text-zinc-500 transition-colors z-10 rounded-md"><i data-lucide="send" class="w-5 h-5"></i></button>
                </div>
            </div>
        </footer>
    </div>

    <script>
        lucide.createIcons();
        let currentMode = 'chat', attachedFile = null, percentageInterval = null, currentSessionId = null;

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }
        function handleEnter(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
        
        function loadHistory() {
            const list = document.getElementById('history-list'); list.innerHTML = '';
            const historyKeys = Object.keys(localStorage).filter(k => k.startsWith('BeastAI_Session_')).sort().reverse();
            if (historyKeys.length === 0) { list.innerHTML = '<div class="text-xs text-zinc-400 italic px-2">No previous sessions.</div>'; return; }

            historyKeys.forEach(key => {
                const sessionData = JSON.parse(localStorage.getItem(key)); if (!sessionData || sessionData.length < 1) return;
                const date = new Date(parseInt(key.replace('BeastAI_Session_', ''))).toLocaleDateString(undefined, {month: 'short', day: 'numeric'});
                let firstMsg = "New Chat";
                try { const f = sessionData.find(m => m.type === 'user'); firstMsg = f ? f.message : "Manifestation"; if (firstMsg.length > 25) firstMsg = firstMsg.substring(0, 25) + '...'; } catch(e) {}

                const isActive = (key === currentSessionId);
                const item = document.createElement('div');
                item.className = `flex items-center gap-3 p-3 rounded-lg cursor-pointer transition no-select border ${isActive ? 'bg-zinc-100 border-zinc-300' : 'hover:bg-zinc-100 border-transparent'}`;
                item.onclick = () => loadSpecificSession(key);
                item.innerHTML = `<i data-lucide="message-square" class="w-4 h-4 text-zinc-400 flex-shrink-0"></i><div class="flex-1 overflow-hidden"><div class="font-semibold text-black truncate">${firstMsg}</div><div class="text-xs text-zinc-500 mt-0.5">${date}</div></div>`;
                list.appendChild(item);
            }); lucide.createIcons();
        }

        function loadSpecificSession(sessionId) {
            currentSessionId = sessionId; document.getElementById('welcome-box').style.display = 'none';
            const chatBox = document.getElementById('chat-box'); chatBox.innerHTML = ''; chatBox.classList.replace('hidden', 'flex');
            JSON.parse(localStorage.getItem(sessionId)).forEach(entry => {
                if (entry.type === 'user') appendUserMessageToUI(entry.message, entry.imgData);
                else appendBeastMessageToUI(entry.message, entry.mode);
            }); loadHistory(); if (window.innerWidth < 1024) toggleSidebar(); setTimeout(scrollToBottom, 100);
        }

        function saveMessageToHistory(type, message, imgData = null, mode = 'chat') {
            if (!currentSessionId) currentSessionId = `BeastAI_Session_${Date.now()}`;
            let data = JSON.parse(localStorage.getItem(currentSessionId)) || [];
            data.push({ type, message, imgData, mode }); localStorage.setItem(currentSessionId, JSON.stringify(data)); loadHistory(); 
        }

        function startNewChat() {
            currentSessionId = null; document.getElementById('chat-box').innerHTML = ''; document.getElementById('chat-box').classList.replace('flex', 'hidden');
            document.getElementById('welcome-box').style.display = 'block'; loadHistory(); if (window.innerWidth < 1024) toggleSidebar(); 
        }

        function runPercentage() {
            const el = document.getElementById('loading-percent'); document.getElementById('send-btn').disabled = true; let start = 0;
            percentageInterval = setInterval(() => { start += Math.floor(Math.random() * 5) + 1; if (start >= 100) start = 99; el.innerText = start + '%'; }, 250);
        }

        function stopPercentage() { clearInterval(percentageInterval); document.getElementById('loading-indicator').classList.replace('flex', 'hidden'); document.getElementById('send-btn').disabled = false; }

        function setMode(mode) {
            currentMode = mode; const isChat = mode === 'chat';
            document.getElementById('btn-converse').className = `text-xs font-bold uppercase tracking-widest pb-1 border-b-2 transition-all whitespace-nowrap ${isChat ? 'border-black text-black' : 'border-transparent text-zinc-400 hover:text-zinc-600'}`;
            document.getElementById('btn-manifest').className = `text-xs font-bold uppercase tracking-widest pb-1 border-b-2 transition-all flex items-center gap-1.5 whitespace-nowrap ${!isChat ? 'border-black text-black' : 'border-transparent text-zinc-400 hover:text-zinc-600'}`;
            document.getElementById('user-input').placeholder = isChat ? "Speak to the Beast..." : "Describe the vision to manifest...";
            document.getElementById('loading-status').innerText = isChat ? "Beast is thinking" : "Beast is manifesting";
        }

        async function downloadManifest(url, btn) {
            const origHTML = btn.innerHTML; btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i><span class="text-xs uppercase tracking-widest font-bold">Saved</span>`; lucide.createIcons();
            try { const res = await fetch(url); const blob = await res.blob(); const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = blobUrl; a.download = `Beast_Manifestation_${Date.now()}.jpg`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(blobUrl);
            } catch (e) { alert("Download failed."); } setTimeout(() => { btn.innerHTML = origHTML; lucide.createIcons(); }, 2000);
        }

        function scrollToBottom() { const container = document.getElementById('scroll-container'); container.scrollTop = container.scrollHeight; }

        async function sendMessage() {
            const input = document.getElementById('user-input'); const chatBox = document.getElementById('chat-box'); const welcomeBox = document.getElementById('welcome-box'); const message = input.value.trim();
            if (!message && !attachedFile) return; input.value = '';
            
            // Hide mobile keyboard after sending to reclaim screen space
            input.blur();

            const currentImgData = attachedFile ? document.getElementById('preview-img').src : null;
            if (welcomeBox.style.display !== 'none') welcomeBox.style.display = 'none';
            chatBox.classList.remove('hidden'); chatBox.classList.add('flex');
            appendUserMessageToUI(message, currentImgData); saveMessageToHistory('user', message, currentImgData, currentMode);
            const formData = new FormData(); formData.append('message', message); formData.append('mode', currentMode); if (attachedFile) formData.append('file', attachedFile);
            clearAttachment(); document.getElementById('loading-indicator').classList.replace('hidden', 'flex'); document.getElementById('loading-percent').innerText = '0%'; runPercentage(); scrollToBottom();

            try {
                const response = await fetch('/api/chat', { method: 'POST', body: formData }); const data = await response.json(); stopPercentage();
                if (currentMode === 'image' && data.reply.startsWith('http')) { appendBeastMessageToUI(data.reply, 'image'); saveMessageToHistory('beast', data.reply, null, 'image'); } 
                else { appendBeastMessageToUI(data.reply || "Connection severed.", data.reply?.includes("Error") ? 'error' : 'chat'); saveMessageToHistory('beast', data.reply, null, data.reply?.includes("Error") ? 'error' : 'chat'); }
            } catch (e) { stopPercentage(); appendBeastMessageToUI("Network Failure. The connection to the Beast was lost.", 'error'); }
            scrollToBottom();
        }

        function appendUserMessageToUI(message, imgData) {
            let html = `
            <div class="flex flex-col items-end w-full max-w-[90%] sm:max-w-[85%] self-end ml-auto gemini-text">
                <div class="flex items-center gap-2 mb-2 text-zinc-400"><span class="text-xs uppercase tracking-widest font-bold">You</span><i data-lucide="user" class="w-4 h-4"></i></div>
                <div class="bg-black text-white p-4 sm:p-5 shadow-lg leading-relaxed whitespace-pre-wrap text-[15px] flex flex-col gap-3 items-end rounded-2xl rounded-tr-sm">`;
            if (imgData) html += `<img src="${imgData}" class="max-w-full h-auto max-h-48 sm:max-h-64 border-2 border-zinc-700 rounded">`;
            if (message) html += `<span>${message}</span>`;
            html += `</div></div>`; document.getElementById('chat-box').insertAdjacentHTML('beforeend', html); lucide.createIcons();
        }

        function appendBeastMessageToUI(message, mode) {
            let content = '';
            if (mode === 'image') {
                content = `
                <div class="flex flex-col items-center gap-4 w-full">
                    <div class="relative group w-full">
                        <img src="${message}" class="w-full h-auto border-4 border-black shadow-lg rounded" onload="scrollToBottom()">
                        <button onclick="downloadManifest('${message}', this)" class="absolute bottom-2 right-2 sm:bottom-4 sm:right-4 p-2 sm:p-3 bg-black text-white opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-2 shadow-lg border border-zinc-700 hover:bg-zinc-800 rounded">
                            <i data-lucide="download" class="w-4 h-4"></i><span class="text-[10px] sm:text-xs uppercase tracking-widest font-bold">Save</span>
                        </button>
                    </div>
                </div>`;
            } else if (mode === 'error') {
                content = `<div class="text-red-900 bg-red-50 p-4 border border-red-900 font-semibold rounded text-sm sm:text-base">${message}</div>`;
            } else {
                content = `<div class="prose prose-sm sm:prose-base prose-zinc max-w-none prose-p:leading-relaxed prose-pre:bg-zinc-900 prose-pre:text-zinc-100 gemini-text break-words">${marked.parse(message)}</div>`;
            }

            let html = `
            <div class="flex flex-col items-start w-full max-w-prose gemini-text">
                <div class="flex items-center gap-2 mb-2 text-black"><i data-lucide="sparkles" class="w-4 h-4"></i><span class="text-xs uppercase tracking-widest font-bold">Beast</span></div>
                <div class="bg-white border border-zinc-200 p-5 sm:p-8 shadow-sm w-full leading-loose text-zinc-900 rounded-2xl rounded-tl-sm">${content}</div>
            </div>`;
            document.getElementById('chat-box').insertAdjacentHTML('beforeend', html); lucide.createIcons();
            
            document.querySelectorAll('pre code').forEach((block) => { block.parentElement.classList.add('p-3', 'sm:p-4', 'rounded-lg', 'overflow-x-auto', 'text-xs', 'sm:text-sm'); });
        }

        function handleFile(input) { if (input.files && input.files[0]) { attachedFile = input.files[0]; const reader = new FileReader(); reader.onload = e => { document.getElementById('preview-img').src = e.target.result; document.getElementById('attachment-preview').classList.replace('hidden', 'inline-block'); }; reader.readAsDataURL(attachedFile); } }
        function clearAttachment() { attachedFile = null; document.getElementById('file-input').value = ''; document.getElementById('attachment-preview').classList.replace('inline-block', 'hidden'); }

        window.onload = loadHistory;
    </script>
</body>
</html>
