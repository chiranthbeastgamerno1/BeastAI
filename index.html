<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Beast AI</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');
        body { background-color: #fafafa; color: #18181b; overflow-x: hidden; font-family: 'Inter', sans-serif; }
        .font-playfair { font-family: 'Playfair Display', serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #d4d4d8; border-radius: 0px; }
        .dot { display: inline-block; animation: bounce 1.4s infinite ease-in-out both; font-size: 2rem; color: #000; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }
        .gemini-text { -webkit-font-smoothing: antialiased; }
    </style>
</head>
<body class="bg-zinc-50 text-zinc-900 flex h-[100dvh] overflow-hidden">

    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-zinc-50 border-r border-zinc-200 p-4 pt-6 flex flex-col z-30 -translate-x-full lg:translate-x-0 transition-transform lg:relative shrink-0">
        <div class="flex items-center justify-between mb-8 px-2 mt-2">
            <span class="font-playfair text-xl font-bold uppercase tracking-[0.2em] text-black">HISTORY</span>
            <button onclick="toggleSidebar()" class="lg:hidden text-zinc-400 hover:text-black outline-none"><i data-lucide="x" class="w-6 h-6"></i></button>
        </div>
        <button onclick="startNewChat()" class="flex items-center gap-3 bg-white border border-zinc-200 hover:bg-zinc-100 text-black px-4 py-3 rounded-lg text-sm mb-6 shadow-sm font-semibold transition-colors gemini-text">
            <i data-lucide="plus-circle" class="w-5 h-5"></i> New Session
        </button>
        <nav id="history-list" class="flex-1 space-y-2 overflow-y-auto pr-2 text-sm text-zinc-700 custom-scrollbar gemini-text"></nav>
        
        <div id="auth-section" class="border-t border-zinc-200 pt-4 mt-auto mb-3 flex flex-col gap-3 min-h-[60px] justify-center">
            <div class="animate-pulse bg-zinc-200 h-10 w-full rounded-lg"></div>
        </div>
        <div class="text-center text-[10px] text-zinc-400 font-bold tracking-widest uppercase gemini-text">BEAST CORE v5.4</div>
    </aside>

    <div class="flex-1 flex flex-col h-full w-full relative min-w-0">
        <header class="flex items-center justify-center px-6 py-4 bg-white border-b-2 border-black shadow-sm z-10 shrink-0 relative">
            <button onclick="toggleSidebar()" class="absolute left-4 lg:hidden text-zinc-400 hover:text-black transition"><i data-lucide="menu" class="w-6 h-6"></i></button>
            <h1 class="text-2xl sm:text-3xl font-black uppercase tracking-[0.25em] text-black font-playfair">Beast Ai</h1>
        </header>

        <main id="scroll-container" class="flex-1 overflow-y-auto p-4 sm:p-8 bg-zinc-50 pb-10 custom-scrollbar">
            <div class="max-w-3xl mx-auto space-y-8 mt-2">
                <div id="welcome-box" class="w-full max-w-md mx-auto text-center p-6 border-y border-zinc-300 bg-white text-zinc-600">
                    <span class="font-playfair italic text-lg tracking-wide">Welcome to Beast Ai.<br>Pure, unadulterated intelligence.</span>
                </div>
                <div id="chat-box" class="w-full space-y-8 hidden flex-col"></div>
                
                <div id="loading-indicator" class="hidden flex-col items-start w-full max-w-prose mt-4">
                    <div class="flex items-end mb-1"><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
                </div>
            </div>
        </main>

        <footer class="w-full bg-white border-t-2 border-black z-20 p-3 sm:p-6 shrink-0">
            <div class="max-w-3xl mx-auto flex flex-col gap-4">
                <div class="relative flex items-end w-full">
                    <textarea id="user-input" rows="1" class="w-full bg-zinc-50 border-2 border-zinc-200 focus:border-black p-3 pr-14 resize-none outline-none text-[15px] rounded-lg min-h-[52px]" placeholder="Speak to the Beast..." onkeydown="handleEnter(event)"></textarea>
                    <button onclick="sendMessage()" id="send-btn" class="absolute right-2 bottom-2 p-2 bg-black text-white rounded-md hover:bg-zinc-800 transition-colors"><i data-lucide="send" class="w-5 h-5"></i></button>
                </div>
            </div>
        </footer>
    </div>

    <script>
        lucide.createIcons();

        // --- FIREBASE CONFIG (PROVEN KEYS) ---
        const firebaseConfig = {
            apiKey: "AIzaSyAMipj8Ae6Hek6rt-okqX3BCi2TE-23OX8",
            authDomain: "beast-ai-database.firebaseapp.com",
            projectId: "beast-ai-database",
            storageBucket: "beast-ai-database.firebasestorage.app",
            messagingSenderId: "102702785923",
            appId: "1:102702785923:web:42926ae65ed8b990e3c2b6"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let currentSessionId = null;

        // FORCE PERSISTENCE
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        // LOGIN REDIRECT HANDLER
        auth.getRedirectResult().then((result) => {
            if (result.user) console.log("Cloud Active");
        }).catch((err) => {
            if (err.code !== 'auth/no-auth-event') alert("Sync Issue: " + err.message);
        });

        // UI OBSERVER
        auth.onAuthStateChanged((user) => {
            const authSection = document.getElementById('auth-section');
            if (user) {
                currentUser = user;
                authSection.innerHTML = `
                    <div class="flex items-center gap-3 bg-zinc-100 p-2 rounded-lg border border-zinc-200">
                        <img src="${user.photoURL}" class="w-8 h-8 rounded-full border border-zinc-300">
                        <div class="flex-1 overflow-hidden">
                            <div class="text-xs font-bold text-black truncate">${user.displayName}</div>
                            <button onclick="logout()" class="text-[10px] text-zinc-500 hover:text-red-600 font-bold uppercase tracking-wider">Sign Out</button>
                        </div>
                    </div>`;
                loadHistory();
            } else {
                currentUser = null;
                authSection.innerHTML = `
                    <button onclick="loginWithGoogle()" class="w-full bg-white border-2 border-black text-black px-4 py-2.5 rounded-lg text-sm font-bold flex items-center justify-center gap-2 hover:bg-black hover:text-white transition shadow-sm">
                        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                        Login with Google
                    </button>`;
            }
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            auth.signInWithRedirect(provider);
        }

        function logout() { auth.signOut().then(() => window.location.reload()); }

        // --- CORE CHAT LOGIC ---
        function startNewChat() { currentSessionId = null; document.getElementById('chat-box').innerHTML = ''; document.getElementById('chat-box').classList.replace('flex', 'hidden'); document.getElementById('welcome-box').style.display = 'block'; if(window.innerWidth < 1024) toggleSidebar(); }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }
        function handleEnter(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
        function scrollToBottom() { const c = document.getElementById('scroll-container'); c.scrollTop = c.scrollHeight; }

        async function loadHistory() {
            if (!currentUser) return;
            const list = document.getElementById('history-list');
            db.collection('users').doc(currentUser.uid).collection('sessions').orderBy('timestamp', 'desc').limit(15).get().then(snap => {
                list.innerHTML = '';
                snap.forEach(doc => {
                    const item = document.createElement('div');
                    item.className = "p-3 hover:bg-zinc-100 cursor-pointer text-xs truncate font-semibold border-b border-zinc-100 transition-colors rounded-lg";
                    const preview = doc.data().messages[0]?.message || "Visual Manifestation";
                    item.innerText = preview.substring(0, 30);
                    item.onclick = () => loadSession(doc.id, doc.data().messages);
                    list.appendChild(item);
                });
            });
        }

        async function loadSession(id, msgs) {
            currentSessionId = id;
            const chatBox = document.getElementById('chat-box'); chatBox.innerHTML = '';
            chatBox.classList.replace('hidden', 'flex'); document.getElementById('welcome-box').style.display = 'none';
            msgs.forEach(m => appendToUI(m.message, m.type));
            if(window.innerWidth < 1024) toggleSidebar();
            scrollToBottom();
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const msg = input.value.trim();
            if (!msg) return;
            input.value = '';

            if (!currentSessionId) currentSessionId = "Session_" + Date.now();
            
            document.getElementById('welcome-box').style.display = 'none';
            document.getElementById('chat-box').classList.replace('hidden', 'flex');
            appendToUI(msg, 'user');
            scrollToBottom();

            document.getElementById('loading-indicator').classList.replace('hidden', 'flex');

            // --- THE BUG FIX: SEND AS FORMDATA ---
            const formData = new FormData();
            formData.append('message', msg);
            formData.append('mode', 'chat');

            try {
                const res = await fetch('/api/chat', { method: 'POST', body: formData });
                const data = await res.json();
                document.getElementById('loading-indicator').classList.replace('flex', 'hidden');
                
                appendToUI(data.reply, 'beast');
                
                if (currentUser) {
                    const ref = db.collection('users').doc(currentUser.uid).collection('sessions').doc(currentSessionId);
                    const doc = await ref.get();
                    const newMsgs = [{type:'user', message:msg}, {type:'beast', message:data.reply}];
                    if (doc.exists) await ref.update({ messages: firebase.firestore.FieldValue.arrayUnion(...newMsgs) });
                    else await ref.set({ timestamp: Date.now(), messages: newMsgs });
                    loadHistory();
                }
            } catch (e) {
                document.getElementById('loading-indicator').classList.replace('flex', 'hidden');
                appendToUI("The connection to the Beast was severed.", 'beast');
            }
            scrollToBottom();
        }

        function appendToUI(m, type) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            if (type === 'user') {
                div.className = "flex flex-col items-end ml-auto max-w-[85%] animate-in fade-in slide-in-from-bottom-2";
                div.innerHTML = `<div class="bg-black text-white p-4 shadow-lg rounded-2xl rounded-tr-sm leading-relaxed text-[15px]">${m}</div>`;
            } else {
                div.className = "flex flex-col items-start w-full max-w-prose animate-in fade-in slide-in-from-bottom-2";
                div.innerHTML = `<div class="flex items-center gap-2 mb-2"><i data-lucide="sparkles" class="w-4 h-4"></i><span class="text-xs font-bold uppercase">Beast</span></div><div class="bg-white border border-zinc-200 p-6 shadow-sm w-full rounded-2xl rounded-tl-sm leading-loose text-zinc-900 prose prose-zinc prose-sm">${marked.parse(m)}</div>`;
            }
            chatBox.appendChild(div);
            lucide.createIcons();
        }
    </script>
</body>
</html>
