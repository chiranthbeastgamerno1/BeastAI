<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Beast AI</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Inter:wght@400;500;600;700;800&display=swap');
        body { background-color: #fafafa; color: #18181b; font-family: 'Inter', sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
        .font-beast-logo { font-family: 'Playfair Display', serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #000; }
        .dot { display: inline-block; animation: bounce 1.4s infinite ease-in-out both; font-size: 2rem; color: #000; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }
    </style>
</head>
<body class="flex h-[100dvh] w-full">

    <aside id="sidebar" class="fixed lg:relative top-0 left-0 h-full w-72 bg-white border-r border-zinc-200 p-6 flex flex-col z-30 transition-transform -translate-x-full lg:translate-x-0">
        <div class="flex items-center justify-between mb-8">
            <span class="font-beast-logo text-xl font-bold uppercase tracking-widest text-black">HISTORY</span>
            <button onclick="clearUnpinned()" class="text-[10px] font-black text-zinc-400 hover:text-red-600 transition uppercase tracking-tighter">Clear All</button>
        </div>
        <button onclick="startNewChat()" class="flex items-center gap-3 bg-black text-white p-4 rounded-lg text-sm font-bold hover:bg-zinc-800 transition mb-6 shadow-md">
            <i data-lucide="plus-circle" class="w-5 h-5"></i> New Session
        </button>
        <nav id="history-list" class="flex-1 space-y-2 overflow-y-auto custom-scrollbar"></nav>
        <div class="border-t pt-4 text-[10px] text-zinc-400 font-bold tracking-widest text-center uppercase">Beast Core v5.5</div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 bg-zinc-50">
        <header class="flex items-center justify-center px-6 py-5 bg-white border-b-2 border-black shadow-sm z-10 relative">
            <button onclick="toggleSidebar()" class="absolute left-4 lg:hidden"><i data-lucide="menu" class="w-6 h-6"></i></button>
            <h1 class="text-3xl font-black uppercase tracking-[0.25em] text-black font-beast-logo">Beast Ai</h1>
        </header>

        <main id="scroll-container" class="flex-1 overflow-y-auto p-4 sm:p-8 custom-scrollbar">
            <div class="max-w-3xl mx-auto space-y-8 mt-4">
                <div id="welcome-box" class="w-full max-w-md mx-auto text-center p-8 border-y border-zinc-300 bg-white text-zinc-600">
                    <span class="italic text-lg tracking-wide">Welcome to Beast Ai.<br>Pure, unadulterated intelligence.</span>
                </div>
                <div id="chat-box" class="w-full space-y-10 hidden flex-col"></div>
                <div id="loading-indicator" class="hidden h-12 flex-col items-start w-full">
                    <div class="flex gap-1 mb-2"><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
                </div>
            </div>
        </main>

        <footer class="bg-white border-t-2 border-black p-4 sm:p-6">
            <div class="max-w-3xl mx-auto flex flex-col gap-4">
                <div class="flex gap-6 px-2">
                    <button id="btn-chat" onclick="setMode('chat')" class="text-xs font-bold uppercase tracking-widest pb-1 border-b-2 border-black text-black">Converse</button>
                    <button id="btn-image" onclick="setMode('image')" class="text-xs font-bold uppercase tracking-widest pb-1 border-b-2 border-transparent text-zinc-400">Manifest Image</button>
                </div>
                <div class="relative flex items-end">
                    <button onclick="document.getElementById('file-input').click()" class="absolute left-2 bottom-2 p-3 text-zinc-500 hover:text-black"><i data-lucide="paperclip" class="w-5 h-5"></i></button>
                    <input type="file" id="file-input" class="hidden" accept="image/*" onchange="handleFile(this)">
                    <textarea id="user-input" rows="1" class="w-full bg-zinc-50 border-2 border-zinc-200 focus:border-black p-4 pl-14 pr-16 resize-none outline-none font-semibold text-[15px] rounded-lg" placeholder="Speak to the Beast..." onkeydown="handleEnter(event)"></textarea>
                    <button onclick="sendMessage()" class="absolute right-2 bottom-2 p-3 bg-black text-white rounded-md"><i data-lucide="send" class="w-5 h-5"></i></button>
                </div>
            </div>
        </footer>
    </div>

    <script>
        lucide.createIcons();
        let currentMode = 'chat', attachedFile = null, currentSessionId = null;

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }
        function handleEnter(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
        function setMode(m) { 
            currentMode = m;
            document.getElementById('btn-chat').className = m === 'chat' ? 'text-xs font-bold uppercase tracking-widest pb-1 border-b-2 border-black text-black' : 'text-xs font-bold uppercase tracking-widest pb-1 border-b-2 border-transparent text-zinc-400';
            document.getElementById('btn-image').className = m === 'image' ? 'text-xs font-bold uppercase tracking-widest pb-1 border-b-2 border-black text-black' : 'text-xs font-bold uppercase tracking-widest pb-1 border-b-2 border-transparent text-zinc-400';
        }

        function loadHistory() {
            const list = document.getElementById('history-list'); list.innerHTML = '';
            const keys = Object.keys(localStorage).filter(k => k.startsWith('BeastSession_')).sort().reverse();
            keys.forEach(id => {
                const session = JSON.parse(localStorage.getItem(id));
                const item = document.createElement('div');
                item.className = `group flex items-center justify-between p-3 border rounded-lg cursor-pointer transition ${id === currentSessionId ? 'bg-zinc-100 border-zinc-300' : 'hover:bg-zinc-50 border-transparent'}`;
                
                const preview = session.messages?.[0]?.message || "New Chat";
                item.innerHTML = `
                    <div class="font-bold text-sm truncate text-black flex-1" onclick="loadSession('${id}')">${preview}</div>
                    <button onclick="togglePin('${id}', event)" class="ml-2 transition ${session.pinned ? 'text-black' : 'text-zinc-200 group-hover:text-zinc-400'}">
                        <i data-lucide="pin" class="w-3 h-3 ${session.pinned ? 'fill-current' : ''}"></i>
                    </button>
                `;
                list.appendChild(item);
            });
            lucide.createIcons();
        }

        function togglePin(id, e) {
            e.stopPropagation();
            const session = JSON.parse(localStorage.getItem(id));
            session.pinned = !session.pinned;
            localStorage.setItem(id, JSON.stringify(session));
            loadHistory();
        }

        function clearUnpinned() {
            if(!confirm("Clear all unpinned chats?")) return;
            const keys = Object.keys(localStorage).filter(k => k.startsWith('BeastSession_'));
            keys.forEach(id => {
                const session = JSON.parse(localStorage.getItem(id));
                if(!session.pinned) localStorage.removeItem(id);
            });
            startNewChat();
            loadHistory();
        }

        function loadSession(id) {
            currentSessionId = id;
            const session = JSON.parse(localStorage.getItem(id));
            document.getElementById('welcome-box').style.display = 'none';
            const chatBox = document.getElementById('chat-box'); chatBox.innerHTML = ''; chatBox.classList.replace('hidden', 'flex');
            session.messages.forEach(m => appendToUI(m.message, m.type, m.mode));
            if(window.innerWidth < 1024) toggleSidebar();
            loadHistory();
        }

        function startNewChat() { currentSessionId = null; document.getElementById('chat-box').innerHTML = ''; document.getElementById('chat-box').classList.replace('flex', 'hidden'); document.getElementById('welcome-box').style.display = 'block'; }

        async function sendMessage() {
            const input = document.getElementById('user-input'); const msg = input.value.trim();
            if (!msg && !attachedFile) return;
            input.value = ''; if (!currentSessionId) currentSessionId = "BeastSession_" + Date.now();
            
            document.getElementById('welcome-box').style.display = 'none';
            document.getElementById('chat-box').classList.replace('hidden', 'flex');
            appendToUI(msg, 'user');
            
            // Show dots
            const indicator = document.getElementById('loading-indicator');
            indicator.classList.replace('hidden', 'flex');

            const formData = new FormData();
            formData.append('message', msg);
            formData.append('mode', currentMode);
            if (attachedFile) formData.append('file', attachedFile);

            try {
                const res = await fetch('/api/chat', { method: 'POST', body: formData });
                const data = await res.json();
                
                // Hide dots immediately
                indicator.classList.replace('flex', 'hidden');
                
                appendToUI(data.reply, 'beast', currentMode);
                
                let session = JSON.parse(localStorage.getItem(currentSessionId)) || { pinned: false, messages: [] };
                session.messages.push({type:'user', message:msg}, {type:'beast', message:data.reply, mode: currentMode});
                localStorage.setItem(currentSessionId, JSON.stringify(session));
                loadHistory();
            } catch(e) { 
                indicator.classList.replace('flex', 'hidden');
                appendToUI("Connection severed! ⚡", 'beast'); 
            }
        }

        function appendToUI(m, type, mode) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            if (type === 'user') {
                div.className = "flex flex-col items-end ml-auto max-w-[85%]";
                div.innerHTML = `<div class="bg-black text-white p-4 shadow-lg rounded-2xl rounded-tr-sm text-[15px] font-medium leading-relaxed">${m}</div>`;
            } else {
                div.className = "flex flex-col items-start w-full max-w-prose";
                const content = mode === 'image' && m.startsWith('http') ? `<img src="${m}" class="w-full border-4 border-black rounded shadow-lg">` : marked.parse(m);
                div.innerHTML = `<div class="flex items-center gap-2 mb-2 text-black"><i data-lucide="sparkles" class="w-4 h-4"></i><span class="text-xs font-bold uppercase tracking-widest">Beast</span></div><div class="bg-white border border-zinc-200 p-6 shadow-sm w-full rounded-2xl rounded-tl-sm text-[15px] font-medium leading-relaxed prose prose-zinc prose-sm">${content}</div>`;
            }
            chatBox.appendChild(div); lucide.createIcons();
            document.getElementById('scroll-container').scrollTop = document.getElementById('scroll-container').scrollHeight;
        }

        function handleFile(i) { if (i.files[0]) { attachedFile = i.files[0]; } }
        window.onload = loadHistory;
    </script>
</body>
</html>
