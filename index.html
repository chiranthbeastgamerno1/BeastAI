<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Beast AI</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');
        body { background-color: #fafafa; color: #18181b; overflow-x: hidden; font-family: 'Inter', sans-serif; }
        .font-playfair { font-family: 'Playfair Display', serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #d4d4d8; border-radius: 0px; }
        .dot { display: inline-block; animation: bounce 1.4s infinite ease-in-out both; font-size: 2rem; color: #000; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }
        .gemini-text { -webkit-font-smoothing: antialiased; }
    </style>
</head>
<body class="bg-zinc-50 text-zinc-900 flex h-[100dvh] overflow-hidden">

    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-zinc-50 border-r border-zinc-200 p-4 pt-6 flex flex-col z-30 -translate-x-full lg:translate-x-0 transition-transform lg:relative shrink-0">
        <div class="flex items-center justify-between mb-8 px-2 mt-2">
            <span class="font-playfair text-xl font-bold uppercase tracking-[0.2em] text-black">HISTORY</span>
            <button onclick="toggleSidebar()" class="lg:hidden text-zinc-400 hover:text-black outline-none"><i data-lucide="x" class="w-6 h-6"></i></button>
        </div>
        <button onclick="startNewChat()" class="flex items-center gap-3 bg-white border border-zinc-200 hover:bg-zinc-100 text-black px-4 py-3 rounded-lg text-sm mb-6 shadow-sm font-semibold transition-colors gemini-text">
            <i data-lucide="plus-circle" class="w-5 h-5"></i> New Session
        </button>
        <nav id="history-list" class="flex-1 space-y-2 overflow-y-auto pr-2 text-sm text-zinc-700 custom-scrollbar gemini-text"></nav>
        
        <div id="auth-section" class="border-t border-zinc-200 pt-4 mt-auto mb-3 flex flex-col gap-3 min-h-[60px] justify-center">
            </div>
        <div class="text-center text-[10px] text-zinc-400 font-bold tracking-widest uppercase gemini-text">BEAST CORE v5.3</div>
    </aside>

    <div class="flex-1 flex flex-col h-full w-full relative min-w-0">
        <header class="flex items-center justify-center px-6 py-4 bg-white border-b-2 border-black shadow-sm z-10 shrink-0 relative">
            <button onclick="toggleSidebar()" class="absolute left-4 lg:hidden text-zinc-400 hover:text-black transition"><i data-lucide="menu" class="w-6 h-6"></i></button>
            <h1 class="text-2xl sm:text-3xl font-black uppercase tracking-[0.25em] text-black font-playfair">Beast Ai</h1>
        </header>

        <main id="scroll-container" class="flex-1 overflow-y-auto p-4 sm:p-8 bg-zinc-50 pb-10">
            <div class="max-w-3xl mx-auto space-y-8 mt-2">
                <div id="welcome-box" class="w-full max-w-md mx-auto text-center p-6 border-y border-zinc-300 bg-white text-zinc-600">
                    <span class="font-playfair italic text-lg tracking-wide">Welcome to Beast Ai.<br>Pure, unadulterated intelligence.</span>
                </div>
                <div id="chat-box" class="w-full space-y-8 hidden flex-col"></div>
            </div>
        </main>

        <footer class="w-full bg-white border-t-2 border-black z-20 p-3 sm:p-6 shrink-0">
            <div class="max-w-3xl mx-auto flex flex-col gap-4">
                <div class="relative flex items-end w-full">
                    <textarea id="user-input" rows="1" class="w-full bg-zinc-50 border-2 border-zinc-200 focus:border-black p-3 pr-14 resize-none outline-none text-[15px] rounded-lg min-h-[52px]" placeholder="Speak to the Beast..." onkeydown="handleEnter(event)"></textarea>
                    <button onclick="sendMessage()" id="send-btn" class="absolute right-2 bottom-2 p-2 bg-black text-white rounded-md"><i data-lucide="send" class="w-5 h-5"></i></button>
                </div>
            </div>
        </footer>
    </div>

    <script>
        lucide.createIcons();

        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyAMipj8Ae6Hek6rt-okqX3BCi2TE-23OX8",
            authDomain: "beast-ai-database.firebaseapp.com",
            projectId: "beast-ai-database",
            storageBucket: "beast-ai-database.firebasestorage.app",
            messagingSenderId: "102702785923",
            appId: "1:102702785923:web:42926ae65ed8b990e3c2b6"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let currentSessionId = null;

        // --- THE LOGIN FIX ---
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        auth.getRedirectResult().then((result) => {
            if (result.user) {
                console.log("Login captured:", result.user.displayName);
            }
        }).catch((err) => {
            if (err.code !== 'auth/no-auth-event') alert("Login Error: " + err.message);
        });

        auth.onAuthStateChanged((user) => {
            const authSection = document.getElementById('auth-section');
            if (user) {
                currentUser = user;
                authSection.innerHTML = `
                    <div class="flex items-center gap-3 bg-zinc-100 p-2 rounded-lg border border-zinc-200">
                        <img src="${user.photoURL}" class="w-8 h-8 rounded-full">
                        <div class="flex-1 overflow-hidden">
                            <div class="text-xs font-bold text-black truncate">${user.displayName}</div>
                            <button onclick="logout()" class="text-[10px] text-zinc-500 hover:text-red-600 font-bold uppercase tracking-wider">Sign Out</button>
                        </div>
                    </div>`;
                loadHistory();
            } else {
                currentUser = null;
                authSection.innerHTML = `
                    <button onclick="loginWithGoogle()" class="w-full bg-white border-2 border-black text-black px-4 py-2.5 rounded-lg text-sm font-bold flex items-center justify-center gap-2 hover:bg-black hover:text-white transition shadow-sm">
                        Login with Google
                    </button>`;
            }
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            auth.signInWithRedirect(provider);
        }

        function logout() { auth.signOut().then(() => window.location.reload()); }

        // --- CORE FUNCTIONS ---
        function startNewChat() { currentSessionId = null; document.getElementById('chat-box').innerHTML = ''; document.getElementById('chat-box').classList.replace('flex', 'hidden'); document.getElementById('welcome-box').style.display = 'block'; }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }
        function handleEnter(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
        
        async function loadHistory() {
            if (!currentUser) return;
            const list = document.getElementById('history-list');
            db.collection('users').doc(currentUser.uid).collection('sessions').orderBy('timestamp', 'desc').get().then(snap => {
                list.innerHTML = '';
                snap.forEach(doc => {
                    const item = document.createElement('div');
                    item.className = "p-2 hover:bg-zinc-100 cursor-pointer text-xs truncate font-medium border-b border-zinc-100";
                    item.innerText = doc.data().messages[0]?.message || "New Session";
                    item.onclick = () => loadSession(doc.id, doc.data().messages);
                    list.appendChild(item);
                });
            });
        }

        async function loadSession(id, msgs) {
            currentSessionId = id;
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';
            chatBox.classList.replace('hidden', 'flex');
            document.getElementById('welcome-box').style.display = 'none';
            msgs.forEach(m => {
                const div = document.createElement('div');
                div.className = m.type === 'user' ? "bg-black text-white p-3 self-end rounded-lg max-w-[80%]" : "bg-white border border-zinc-200 p-3 self-start rounded-lg max-w-[80%]";
                div.innerText = m.message;
                chatBox.appendChild(div);
            });
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const msg = input.value.trim();
            if (!msg) return;
            input.value = '';

            if (!currentSessionId) currentSessionId = "Session_" + Date.now();
            
            // UI Update
            document.getElementById('welcome-box').style.display = 'none';
            const chatBox = document.getElementById('chat-box');
            chatBox.classList.replace('hidden', 'flex');
            const userDiv = document.createElement('div');
            userDiv.className = "bg-black text-white p-3 self-end rounded-lg max-w-[80%]";
            userDiv.innerText = msg;
            chatBox.appendChild(userDiv);

            // API Call
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg })
            });
            const data = await res.json();

            const beastDiv = document.createElement('div');
            beastDiv.className = "bg-white border border-zinc-200 p-3 self-start rounded-lg max-w-[80%]";
            beastDiv.innerText = data.reply;
            chatBox.appendChild(beastDiv);

            // SAVE TO CLOUD
            if (currentUser) {
                const ref = db.collection('users').doc(currentUser.uid).collection('sessions').doc(currentSessionId);
                const doc = await ref.get();
                const newMsgs = [{type:'user', message:msg}, {type:'beast', message:data.reply}];
                if (doc.exists) await ref.update({ messages: firebase.firestore.FieldValue.arrayUnion(...newMsgs) });
                else await ref.set({ timestamp: Date.now(), messages: newMsgs });
                loadHistory();
            }
        }
    </script>
</body>
</html>
