<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Beast AI</title>
  <meta name="theme-color" content="#eef2f7" id="theme-color-meta" />
  <link rel="icon" href="/beast_ai.png" type="image/png" />
  <link rel="apple-touch-icon" href="/beast_ai.png" />
  <link rel="manifest" href="/manifest.json" />

  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap');
    html, body { height: 100%; margin: 0; overflow: hidden; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    body { background: #eef2f7; }
    .font-beast-logo { font-family: 'Playfair Display', serif; }
    .pb-safe { padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    .pt-safe { padding-top: max(8px, env(safe-area-inset-top)); }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); border-radius: 999px; }
    body.dark .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); }

    @keyframes aurora { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    #light-aurora { position: fixed; inset: 0; z-index: -2; background: linear-gradient(-45deg, #e8f0fe, #fce4ec, #e0f2fe, #fef3c7, #d1fae5); background-size: 300% 300%; animation: aurora 16s ease infinite; transition: opacity .7s ease; opacity: 1; }
    #dark-aurora { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 20% 10%, rgba(37,99,235,.45), transparent 32%), radial-gradient(circle at 80% 20%, rgba(147,51,234,.35), transparent 28%), radial-gradient(circle at 30% 100%, rgba(96,165,250,.20), transparent 28%), #09090b; opacity: 0; transition: opacity .7s ease; }
    body.dark #light-aurora { opacity: 0; }
    body.dark #dark-aurora { opacity: 1; }

    @keyframes logoPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(37,99,235,.28), 0 0 36px rgba(147,51,234,.18);} 50% { box-shadow: 0 0 0 10px rgba(37,99,235,0), 0 0 56px rgba(147,51,234,.28);} }
    @keyframes msgUser { 0% { opacity: 0; transform: translateY(16px) scale(.96);} 60% { opacity: 1; transform: translateY(-2px) scale(1.01);} 100% { opacity: 1; transform: translateY(0) scale(1);} }
    @keyframes msgBeast { 0% { opacity: 0; transform: translateY(22px) scale(.97); filter: blur(6px);} 65% { opacity: 1; transform: translateY(-3px) scale(1.01); filter: blur(0);} 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0);} }
    @keyframes sheen { 0% { transform: translateX(-130%) skewX(-18deg); opacity: 0; } 18% { opacity: .32; } 100% { transform: translateX(150%) skewX(-18deg); opacity: 0; } }
    @keyframes halo { 0%,100% { box-shadow: 0 0 0 0 rgba(24,24,27,.15); } 50% { box-shadow: 0 0 0 10px rgba(24,24,27,0); } }
    @keyframes dots { 0%,80%,100% { transform: scale(0); opacity: .3; } 40% { transform: scale(1); opacity: 1; } }
    @keyframes orb { 0%,100% { transform: scale(.9); opacity: .65; } 50% { transform: scale(1.08); opacity: 1; } }
    .message-user { animation: msgUser .42s cubic-bezier(.22,1,.36,1) both; }
    .message-beast { animation: msgBeast .56s cubic-bezier(.22,1,.36,1) both; }
    .bubble-sheen { position: relative; overflow: hidden; }
    .bubble-sheen::after { content: ''; position: absolute; inset: -40% auto -40% -15%; width: 34%; background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.22) 45%, transparent 100%); pointer-events: none; animation: sheen 1.15s ease-out 1; }
    .send-ready { animation: halo 2.1s ease-in-out infinite; }
    .thinking-orb { width: 12px; height: 12px; border-radius: 999px; background: linear-gradient(135deg, #2563eb, #9333ea); box-shadow: 0 0 20px rgba(37,99,235,.28), 0 0 26px rgba(147,51,234,.24); animation: orb 1.2s ease-in-out infinite; }
    .jumping-dots span { display: inline-block; width: 8px; height: 8px; margin: 0 2px; border-radius: 999px; background: currentColor; animation: dots 1.2s infinite ease-in-out both; }
    .jumping-dots span:nth-child(1) { animation-delay: -.32s; } .jumping-dots span:nth-child(2) { animation-delay: -.16s; }

    .beast-prose, .beast-prose * { user-select: text; }
    .beast-prose p { margin: .45em 0; }
    .beast-prose strong { font-weight: 800; }
    .beast-prose em { font-style: normal; font-weight: 800; }
    .beast-prose pre { background: rgba(20,20,24,.96); color: #e4e4e7; border-radius: 16px; padding: 16px; overflow-x: auto; border: 1px solid rgba(255,255,255,.08); }
    .beast-prose code:not(pre code) { background: rgba(0,0,0,.07); padding: .15em .4em; border-radius: 6px; font-size: .88em; }
    body.dark .beast-prose code:not(pre code) { background: rgba(255,255,255,.10); }
    .beast-prose img, .beast-prose video { max-width: 100%; border-radius: 16px; margin: .7em 0; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
    .beast-prose a { color: #2563eb; text-decoration: underline; text-underline-offset: 3px; }

    .menu-pop { animation: msgIn .18s cubic-bezier(.22,1,.36,1) both; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px) scale(.96);} to { opacity: 1; transform: translateY(0) scale(1);} }
  </style>
</head>
<body class="text-zinc-900 dark:text-zinc-100">
  <div id="light-aurora"></div>
  <div id="dark-aurora"></div>

  <div id="name-modal" class="fixed inset-0 bg-black/60 z-[100] hidden items-center justify-center backdrop-blur-md px-4">
    <div class="bg-white dark:bg-[#1e1e20] p-6 sm:p-8 rounded-3xl shadow-2xl max-w-sm w-full border border-zinc-200 dark:border-zinc-800">
      <div class="flex justify-center mb-4"><img src="/beast_ai.png" class="w-16 h-16 rounded-full object-cover bg-black" style="animation: logoPulse 3.2s ease-in-out infinite"></div>
      <h3 class="text-xl font-bold text-center text-zinc-900 dark:text-white mb-2">Initialize Beast AI</h3>
      <p class="text-sm text-center text-zinc-500 dark:text-zinc-400 mb-6 font-medium">By what name shall the Beast address you?</p>
      <input id="name-input" type="text" placeholder="Enter your name..." class="w-full bg-zinc-100 dark:bg-[#0e0e11] text-zinc-900 dark:text-white rounded-xl px-4 py-3.5 mb-6 outline-none focus:ring-2 focus:ring-zinc-400 font-semibold text-center" />
      <button onclick="saveName()" class="w-full bg-zinc-900 hover:bg-black dark:bg-white text-white dark:text-black font-bold py-3.5 rounded-xl transition-transform active:scale-95">Confirm</button>
    </div>
  </div>

  <div class="fixed inset-0 flex flex-col">
    <header class="flex items-center justify-between px-4 sm:px-6 py-3 pt-safe z-10">
      <div class="flex items-center gap-3">
        <img src="/beast_ai.png" class="w-9 h-9 rounded-full object-cover bg-black" alt="Beast AI">
        <div>
          <div class="font-beast-logo tracking-[0.22em] uppercase text-sm font-black">Beast</div>
          <div class="text-xs text-zinc-500 dark:text-zinc-400 font-semibold">Vercel export</div>
        </div>
      </div>
      <button id="theme-btn" onclick="toggleTheme()" class="px-4 h-10 rounded-full bg-white/80 dark:bg-white/[0.08] backdrop-blur-md border border-black/5 dark:border-white/10 font-bold text-sm">Dark</button>
    </header>

    <main id="scroll" class="flex-1 overflow-y-auto custom-scrollbar relative">
      <div class="max-w-3xl mx-auto px-4 sm:px-8 pb-44">
        <div id="welcome" class="w-full text-center flex flex-col items-center justify-center mt-[12vh] sm:mt-[15vh]">
          <img src="/beast_ai.png" class="w-16 h-16 sm:w-20 sm:h-20 mb-6 rounded-full object-cover bg-black" style="animation: logoPulse 3.2s ease-in-out infinite" alt="Beast AI">
          <h2 id="greeting" class="text-3xl sm:text-4xl font-semibold tracking-tight pb-2"></h2>
          <p class="text-sm sm:text-[15px] font-medium text-zinc-500 dark:text-zinc-400">Ask anything. Manifest images. Unleash the Beast.</p>
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-2 sm:gap-2.5 mt-9 w-full max-w-2xl px-1">
            <button onclick="quickPrompt('A majestic black panther made of galaxy stardust, cinematic lighting', 'image')" class="text-left p-4 rounded-2xl bg-white/70 dark:bg-white/[0.06] backdrop-blur-md border border-black/[0.06] dark:border-white/10 hover:bg-white/90 dark:hover:bg-white/10">
              <div class="text-sm font-bold">Manifest an image</div><div class="text-xs text-zinc-400 mt-1">A majestic black panther...</div>
            </button>
            <button onclick="quickPrompt('Write a snake game in Python with pygame', 'chat')" class="text-left p-4 rounded-2xl bg-white/70 dark:bg-white/[0.06] backdrop-blur-md border border-black/[0.06] dark:border-white/10 hover:bg-white/90 dark:hover:bg-white/10">
              <div class="text-sm font-bold">Forge some code</div><div class="text-xs text-zinc-400 mt-1">Write a snake game...</div>
            </button>
            <button onclick="quickPrompt('Explain how black holes work, simply', 'chat')" class="text-left p-4 rounded-2xl bg-white/70 dark:bg-white/[0.06] backdrop-blur-md border border-black/[0.06] dark:border-white/10 hover:bg-white/90 dark:hover:bg-white/10">
              <div class="text-sm font-bold">Learn anything</div><div class="text-xs text-zinc-400 mt-1">Explain black holes...</div>
            </button>
            <button onclick="quickPrompt('Give me 5 wild startup ideas that sound impossible but are not', 'chat')" class="text-left p-4 rounded-2xl bg-white/70 dark:bg-white/[0.06] backdrop-blur-md border border-black/[0.06] dark:border-white/10 hover:bg-white/90 dark:hover:bg-white/10">
              <div class="text-sm font-bold">Get inspired</div><div class="text-xs text-zinc-400 mt-1">Give me 5 wild ideas...</div>
            </button>
          </div>
        </div>

        <div id="chat-box" class="hidden flex-col pt-5 pb-8"></div>
      </div>
    </main>
  </div>

  <div class="fixed bottom-0 left-0 right-0 z-30 pb-safe">
    <div class="max-w-3xl mx-auto px-3 sm:px-4 pb-2 pt-3">
      <div id="attachment-preview" class="hidden ml-3 mb-2.5 flex gap-2 overflow-x-auto custom-scrollbar max-w-full"></div>
      <div id="mode-chip-row" class="hidden ml-3 mb-2"></div>

      <div class="relative grid grid-cols-[auto,1fr,auto] items-center gap-1.5 w-full bg-white/95 dark:bg-[#1e1e20]/95 backdrop-blur-md rounded-[1.85rem] sm:rounded-[2.2rem] shadow-[0_4px_25px_rgb(0,0,0,0.12)] dark:shadow-[0_4px_25px_rgb(0,0,0,0.6)] p-1.5 sm:p-2 border border-zinc-200/80 dark:border-zinc-700/60">
        <div class="relative">
          <button id="attach-btn" onclick="toggleAttachMenu()" class="w-10 h-10 flex items-center justify-center text-zinc-500 hover:text-zinc-900 dark:hover:text-white rounded-full"><i data-lucide="plus" id="plus-icon" class="w-5 h-5 transition-transform"></i></button>
          <div id="attach-menu" class="menu-pop hidden absolute bottom-[calc(100%+0.8rem)] left-0 w-[235px] bg-white dark:bg-[#252528] border border-black/5 dark:border-white/10 rounded-2xl shadow-2xl p-1.5">
            <button onclick="document.getElementById('file-input').click(); toggleAttachMenu(false)" class="w-full text-left px-3 py-2.5 hover:bg-black/5 dark:hover:bg-white/5 rounded-xl flex items-center gap-3"><i data-lucide="upload" class="w-4 h-4"></i><span class="text-[14px] font-semibold">Upload file</span></button>
            <button onclick="setMode('image'); toggleAttachMenu(false)" class="w-full text-left px-3 py-2.5 hover:bg-black/5 dark:hover:bg-white/5 rounded-xl flex items-center gap-3"><i data-lucide="image" class="w-4 h-4"></i><span class="text-[14px] font-semibold">Image Generation</span></button>
            <button onclick="setMode('video'); toggleAttachMenu(false)" class="w-full text-left px-3 py-2.5 hover:bg-black/5 dark:hover:bg-white/5 rounded-xl flex items-center gap-3"><i data-lucide="video" class="w-4 h-4"></i><span class="text-[14px] font-semibold">Video Generation</span></button>
            <button onclick="setMode('video-fast'); toggleAttachMenu(false)" class="w-full text-left px-3 py-2.5 hover:bg-black/5 dark:hover:bg-white/5 rounded-xl flex items-center gap-3"><i data-lucide="zap" class="w-4 h-4"></i><span class="text-[14px] font-semibold">Video Generation - Fast</span></button>
          </div>
        </div>

        <input id="file-input" type="file" class="hidden" accept="image/*,application/pdf" multiple onchange="handleFile(this)">

        <div class="flex items-center min-w-0 min-h-[44px]">
          <textarea id="user-input" rows="1" placeholder="Ask Beast..." oninput="checkInput()" onkeydown="handleEnter(event)" class="w-full bg-transparent border-none outline-none resize-none max-h-[140px] min-h-[26px] py-2.5 px-2 sm:px-3 text-[15px] sm:text-base text-zinc-900 dark:text-white placeholder-zinc-500 font-medium leading-[1.4] custom-scrollbar overflow-y-auto"></textarea>
        </div>

        <div class="flex items-center gap-1 sm:gap-1.5 pr-1">
          <div class="relative">
            <button id="speed-btn" onclick="toggleSpeedMenu()" class="h-10 flex items-center gap-1.5 px-3 bg-zinc-100 dark:bg-[#2e2e31] rounded-2xl hover:bg-zinc-200 dark:hover:bg-[#3a3a3d] transition-colors text-zinc-700 dark:text-zinc-300"><span id="speed-label" class="text-xs sm:text-sm font-semibold tracking-wide">PRO</span><i data-lucide="chevron-down" id="speed-chevron" class="w-4 h-4 transition-transform"></i></button>
            <div id="speed-menu" class="menu-pop hidden absolute bottom-[calc(100%+0.8rem)] right-0 w-[224px] bg-white dark:bg-[#252528] border border-black/5 dark:border-white/10 rounded-2xl shadow-2xl overflow-hidden">
              <button onclick="setSpeed('fast')" class="w-full text-left px-4 py-3 hover:bg-black/5 dark:hover:bg-white/5 flex items-start gap-3"><div class="w-5 flex justify-center mt-0.5"><i data-lucide="zap" class="w-4 h-4"></i></div><div><div class="text-[14px] font-bold leading-tight">Fast</div><div class="text-[12px] text-zinc-500 dark:text-zinc-400 mt-0.5">Kira 3.5 Flash</div></div></button>
              <div class="h-px bg-black/5 dark:bg-white/5"></div>
              <button onclick="setSpeed('normal')" class="w-full text-left px-4 py-3 hover:bg-black/5 dark:hover:bg-white/5 flex items-start gap-3"><div class="w-5 flex justify-center mt-0.5"><i data-lucide="sparkles" class="w-4 h-4"></i></div><div><div class="text-[14px] font-bold leading-tight">Normal</div><div class="text-[12px] text-zinc-500 dark:text-zinc-400 mt-0.5">Gemini Flash</div></div></button>
              <div class="h-px bg-black/5 dark:bg-white/5"></div>
              <button onclick="setSpeed('pro')" class="w-full text-left px-4 py-3 hover:bg-black/5 dark:hover:bg-white/5 flex items-start gap-3"><div class="w-5 flex justify-center mt-0.5"><i data-lucide="crown" class="w-4 h-4"></i></div><div><div class="text-[14px] font-bold leading-tight">PRO</div><div class="text-[12px] text-zinc-500 dark:text-zinc-400 mt-0.5">Grok</div></div></button>
            </div>
          </div>
          <button onclick="toggleMic()" id="mic-btn" class="w-10 h-10 flex items-center justify-center text-zinc-500 hover:text-zinc-900 dark:hover:text-white rounded-full"><i data-lucide="mic" class="w-5 h-5"></i></button>
          <button id="send-btn" onclick="sendMessage()" class="hidden send-ready w-10 h-10 items-center justify-center bg-zinc-900 hover:bg-black dark:bg-zinc-100 dark:hover:bg-white text-white dark:text-black rounded-full transition-all active:scale-95 shadow-md"><i data-lucide="arrow-up" class="w-5 h-5"></i></button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentMode = 'chat';
    let currentSpeed = 'pro';
    let attachedFiles = [];
    let userName = localStorage.getItem('beast-username') || '';
    let isListening = false;
    let recog = null;

    function initTheme() {
      const saved = localStorage.getItem('beast-theme');
      const dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.body.classList.toggle('dark', dark);
      document.getElementById('theme-btn').textContent = dark ? 'Light' : 'Dark';
      document.getElementById('theme-color-meta').setAttribute('content', dark ? '#09090b' : '#eef2f7');
    }

    function toggleTheme() {
      const dark = !document.body.classList.contains('dark');
      document.body.classList.toggle('dark', dark);
      localStorage.setItem('beast-theme', dark ? 'dark' : 'light');
      document.getElementById('theme-btn').textContent = dark ? 'Light' : 'Dark';
      document.getElementById('theme-color-meta').setAttribute('content', dark ? '#09090b' : '#eef2f7');
    }

    function setGreeting() {
      const name = userName || 'MASTER';
      const greetings = [`Ask away, ${name}!`, `The mic is yours, ${name}.`, `Your move, ${name}!`, `Ready when you are, ${name}.`];
      document.getElementById('greeting').innerText = greetings[Math.floor(Math.random() * greetings.length)];
    }

    function saveName() {
      const value = document.getElementById('name-input').value.trim();
      if (!value) return;
      userName = value;
      localStorage.setItem('beast-username', value);
      document.getElementById('name-modal').classList.add('hidden');
      document.getElementById('name-modal').classList.remove('flex');
      setGreeting();
    }

    function quickPrompt(text, mode) {
      setMode(mode);
      document.getElementById('user-input').value = text;
      checkInput();
      document.getElementById('user-input').focus();
    }

    function setMode(mode) {
      currentMode = mode;
      const input = document.getElementById('user-input');
      const row = document.getElementById('mode-chip-row');
      const labels = {
        chat: '', image: 'Image Generation', video: 'Video Generation', 'video-fast': 'Video Generation - Fast'
      };
      input.placeholder = mode === 'image' ? 'Kira 3.0 Image: Describe image...' : mode === 'video' ? 'Kira 3.0 Video: Describe video...' : mode === 'video-fast' ? 'Kira 3.0 Video Flash: Describe video...' : 'Ask Beast...';
      if (mode === 'chat') {
        row.classList.add('hidden');
        row.innerHTML = '';
      } else {
        row.classList.remove('hidden');
        row.innerHTML = `<div class="flex"><div class="flex items-center gap-2 pl-3 pr-2 py-1.5 rounded-full bg-white/90 dark:bg-[#2a2a2d]/90 backdrop-blur-md border border-black/5 dark:border-white/10 shadow-sm"><span class="text-xs font-bold">${labels[mode]}</span><button onclick="setMode('chat')" class="p-0.5 rounded-full text-zinc-400 hover:text-zinc-900 dark:hover:text-white"><i data-lucide="x" class="w-3.5 h-3.5"></i></button></div></div>`;
        lucide.createIcons();
      }
    }

    function setSpeed(speed) {
      currentSpeed = speed;
      document.getElementById('speed-label').textContent = speed === 'fast' ? 'Fast' : speed === 'normal' ? 'Normal' : 'PRO';
      document.getElementById('speed-menu').classList.add('hidden');
      document.getElementById('speed-chevron').style.transform = 'rotate(0deg)';
    }

    function toggleAttachMenu(force) {
      const menu = document.getElementById('attach-menu');
      const icon = document.getElementById('plus-icon');
      const open = force === undefined ? menu.classList.contains('hidden') : force;
      menu.classList.toggle('hidden', !open);
      icon.style.transform = open ? 'rotate(45deg)' : 'rotate(0deg)';
    }

    function toggleSpeedMenu() {
      const menu = document.getElementById('speed-menu');
      const open = menu.classList.contains('hidden');
      menu.classList.toggle('hidden', !open);
      document.getElementById('speed-chevron').style.transform = open ? 'rotate(180deg)' : 'rotate(0deg)';
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#attach-menu') && !e.target.closest('#attach-btn')) toggleAttachMenu(false);
      if (!e.target.closest('#speed-menu') && !e.target.closest('#speed-btn')) {
        document.getElementById('speed-menu').classList.add('hidden');
        document.getElementById('speed-chevron').style.transform = 'rotate(0deg)';
      }
    });

    function checkInput() {
      const input = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 140) + 'px';
      if (input.value.trim() || attachedFiles.length) {
        sendBtn.classList.remove('hidden'); sendBtn.classList.add('flex');
      } else {
        sendBtn.classList.add('hidden'); sendBtn.classList.remove('flex');
      }
    }

    function handleEnter(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    async function fileToPayload(file) {
      if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
        const dataUrl = await new Promise((resolve) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.readAsDataURL(file); });
        return { name: file.name, isPdf: true, preview: null, data: String(dataUrl).split(',')[1], mimeType: 'application/pdf' };
      }
      const dataUrl = await new Promise((resolve) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.readAsDataURL(file); });
      return { name: file.name, isPdf: false, preview: String(dataUrl), data: String(dataUrl).split(',')[1], mimeType: file.type || 'image/jpeg' };
    }

    async function handleFile(input) {
      const incoming = Array.from(input.files || []).slice(0, 20 - attachedFiles.length);
      for (const file of incoming) attachedFiles.push(await fileToPayload(file));
      input.value = '';
      renderAttachmentPreviews();
    }

    function renderAttachmentPreviews() {
      const wrap = document.getElementById('attachment-preview');
      wrap.innerHTML = '';
      if (!attachedFiles.length) { wrap.classList.add('hidden'); checkInput(); return; }
      wrap.classList.remove('hidden');
      attachedFiles.forEach((f, i) => {
        const div = document.createElement('div');
        div.className = 'relative inline-block';
        div.innerHTML = f.isPdf ? `<div class="h-14 w-14 bg-red-100 dark:bg-red-950/60 border border-red-300 dark:border-red-900 rounded-xl flex flex-col items-center justify-center shadow-sm p-1"><i data-lucide="file-text" class="w-4 h-4 text-red-700 dark:text-red-400 mb-0.5"></i><span class="text-[8px] font-bold text-red-800 dark:text-red-300 truncate w-full text-center">${f.name}</span></div>` : `<img src="${f.preview}" class="h-14 w-auto rounded-xl shadow-md object-cover border border-black/10 dark:border-white/15">`;
        div.innerHTML += `<button onclick="removeAttachment(${i})" class="absolute -top-2 -right-2 bg-zinc-800 text-white p-1 rounded-full shadow-md"><i data-lucide="x" class="w-3 h-3"></i></button>`;
        wrap.appendChild(div);
      });
      lucide.createIcons();
      checkInput();
    }

    function removeAttachment(index) { attachedFiles.splice(index, 1); renderAttachmentPreviews(); }

    function processMedia(text) {
      return text.replace(/(?:!\[.*?\]\()?(https?:\/\/[^\s)]+\.mp4)(?:\))?/gi, '\n\n<video src="$1" controls autoplay loop playsinline class="w-full rounded-xl my-3"></video>\n\n');
    }

    function appendUser(msg, files) {
      document.getElementById('welcome').style.display = 'none';
      const chat = document.getElementById('chat-box');
      chat.classList.remove('hidden');
      chat.classList.add('flex');
      let html = `<div class="flex justify-end w-full mb-6 message-user"><div class="bubble-sheen bg-white/90 dark:bg-zinc-800/90 backdrop-blur-md text-zinc-900 dark:text-zinc-100 px-5 py-3 rounded-[1.5rem] rounded-tr-sm max-w-[85%] text-[15px] sm:text-base leading-relaxed shadow-sm border border-black/5 dark:border-white/10">`;
      if (files.length) {
        html += `<div class="flex flex-wrap gap-2 justify-end mb-2">`;
        files.forEach(f => { html += f.isPdf ? `<div class="px-3 py-2 bg-red-100/90 dark:bg-red-900/50 rounded-xl border border-red-300/60 dark:border-red-500/40 text-xs font-bold flex items-center gap-2 text-red-800 dark:text-red-200"><i data-lucide="file-text" class="w-4 h-4"></i><span class="max-w-[140px] truncate">${f.name}</span></div>` : `<img src="${f.preview}" class="max-h-32 rounded-xl object-cover shadow-sm">`; });
        html += `</div>`;
      }
      if (msg) html += `<span class="font-medium whitespace-pre-wrap">${msg}</span>`;
      html += `</div></div>`;
      chat.insertAdjacentHTML('beforeend', html);
      lucide.createIcons();
    }

    function appendPending(id) {
      const chat = document.getElementById('chat-box');
      const html = `<div id="beast-${id}" class="flex flex-col items-start w-full max-w-[92%] mb-6 message-beast"><div class="flex items-center gap-3 mb-2"><img src="/beast_ai.png" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full object-cover shadow-sm bg-black"><span class="text-[13px] font-bold uppercase tracking-wide">Beast AI</span></div><div class="pl-[2.5rem] sm:pl-[2.75rem] w-full"><div id="loader-${id}" class="flex items-center gap-3 py-2"><div class="thinking-orb"></div><div class="jumping-dots text-zinc-500 dark:text-zinc-400"><span></span><span></span><span></span></div><div class="h-px w-16 bg-gradient-to-r from-blue-500/50 via-purple-500/35 to-transparent rounded-full"></div></div><div id="reply-${id}" class="hidden pr-3 beast-prose"></div></div></div>`;
      chat.insertAdjacentHTML('beforeend', html);
    }

    function typeReply(id, reply) {
      const loader = document.getElementById(`loader-${id}`);
      const box = document.getElementById(`reply-${id}`);
      loader.style.display = 'none';
      box.classList.remove('hidden');
      let shown = 0;
      const step = Math.max(3, Math.ceil(reply.length / 180));
      const timer = setInterval(() => {
        shown = Math.min(reply.length, shown + step);
        box.innerHTML = marked.parse(processMedia(reply.slice(0, shown)));
        if (shown >= reply.length) clearInterval(timer);
        document.getElementById('scroll').scrollTop = document.getElementById('scroll').scrollHeight;
      }, 14);
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const msg = input.value.trim();
      if (!msg && !attachedFiles.length) return;
      const modeToSend = currentMode;
      const speedToSend = currentSpeed;
      const filesToSend = [...attachedFiles];
      appendUser(msg, filesToSend);
      const id = Date.now();
      appendPending(id);
      input.value = '';
      attachedFiles = [];
      renderAttachmentPreviews();
      setMode('chat');
      checkInput();
      document.getElementById('scroll').scrollTop = document.getElementById('scroll').scrollHeight;

      try {
        const formData = new FormData();
        formData.append('message', msg);
        formData.append('mode', modeToSend);
        formData.append('speed', speedToSend);
        formData.append('history', JSON.stringify([]));
        for (const f of filesToSend) {
          if (f.data) {
            const byteStr = atob(f.data);
            const bytes = new Uint8Array(byteStr.length);
            for (let i = 0; i < byteStr.length; i++) bytes[i] = byteStr.charCodeAt(i);
            const blob = new Blob([bytes], { type: f.mimeType || 'image/jpeg' });
            formData.append('files', blob, f.name);
          }
        }
        const res = await fetch('/api/chat', { method: 'POST', body: formData });
        const data = await res.json();
        typeReply(id, data.reply || 'Connection severed.');
      } catch (e) {
        typeReply(id, 'The connection was severed! Fire your query again.');
      }
    }

    function toggleMic() {
      if (isListening && recog) { recog.stop(); isListening = false; document.getElementById('mic-btn').classList.remove('text-red-500','bg-red-500/10','animate-pulse'); return; }
      const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Ctor) { alert('Voice input is not supported in this browser. Try Chrome.'); return; }
      recog = new Ctor();
      recog.lang = 'en-US'; recog.interimResults = true; recog.continuous = false;
      recog.onresult = (e) => {
        let transcript = '';
        for (let i = 0; i < e.results.length; i++) transcript += e.results[i][0].transcript;
        document.getElementById('user-input').value = transcript.trim();
        checkInput();
      };
      recog.onend = () => { isListening = false; document.getElementById('mic-btn').classList.remove('text-red-500','bg-red-500/10','animate-pulse'); };
      recog.start();
      isListening = true;
      document.getElementById('mic-btn').classList.add('text-red-500','bg-red-500/10','animate-pulse');
    }

    initTheme();
    if (!userName) { document.getElementById('name-modal').classList.remove('hidden'); document.getElementById('name-modal').classList.add('flex'); }
    setGreeting();
    lucide.createIcons();
  </script>
</body>
</html>
