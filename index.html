<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Beast AI</title>
    
    <link rel="icon" href="/beast_ai.png" type="image/png">
    <link rel="apple-touch-icon" href="/beast_ai.png">
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#fafafa" id="theme-color-meta">
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Inter:wght@400;500;600;700;800&display=swap');
        
        body { background-color: #fafafa; color: #18181b; font-family: 'Inter', sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; transition: background-color 0.3s, color 0.3s; }
        .font-beast-logo { font-family: 'Playfair Display', serif; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #d4d4d8; border-radius: 4px; }
        
        .dot { display: inline-block; animation: bounce 1.4s infinite ease-in-out both; font-size: 2.5rem; line-height: 0.2; margin-right: 2px; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }

        /* Magical Gemini Aura CSS */
        @keyframes gemini-aura { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .gemini-glow { position: relative; z-index: 1; }
        .gemini-glow::before { content: ''; position: absolute; inset: -3px; background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570, #fbbc05, #4285f4); background-size: 200% 200%; animation: gemini-aura 3s linear infinite; border-radius: 0.6rem; z-index: -1; filter: blur(8px); opacity: 0; transition: opacity 0.3s ease; }
        .gemini-glow:focus-within::before { opacity: 0.85; }
        .gemini-text { background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570, #fbbc05, #4285f4); background-size: 200% 200%; animation: gemini-aura 3s linear infinite; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        @media (min-width: 1024px) { .desktop-collapsed { margin-left: -18rem; } }

        /* 🚀 SAFE DARK MODE OVERRIDES (Touches ZERO JS logic) */
        body.dark { background-color: #09090b !important; color: #f4f4f5 !important; }
        body.dark .bg-white { background-color: #18181b !important; border-color: #27272a !important; }
        body.dark .bg-zinc-50 { background-color: #09090b !important; }
        body.dark .text-black, body.dark .text-zinc-900 { color: #f4f4f5 !important; }
        body.dark .border-black, body.dark .border-zinc-200, body.dark .border-zinc-300 { border-color: #27272a !important; }
        body.dark .bg-black { background-color: #f4f4f5 !important; color: #18181b !important; }
        body.dark .text-white { color: #18181b !important; }
        body.dark .text-zinc-400, body.dark .text-zinc-500, body.dark .text-zinc-600 { color: #a1a1aa !important; }
        body.dark .bg-zinc-100 { background-color: #27272a !important; color: #f4f4f5 !important; }
        body.dark .hover\:bg-zinc-800:hover { background-color: #d4d4d8 !important; }
        body.dark .bg-red-50 { background-color: #450a0a !important; color: #fca5a5 !important; border-color: #7f1d1d !important;}
        body.dark .bg-red-100 { background-color: #7f1d1d !important; color: #fca5a5 !important;}
        body.dark aside, body.dark header, body.dark footer, body.dark textarea { background-color: #18181b !important; border-color: #27272a !important; color: #f4f4f5 !important; }
    </style>
</head>
<body class="flex h-[100dvh] w-full">
    <svg style="width:0;height:0;position:absolute;" aria-hidden="true" focusable="false"><linearGradient id="gemini-gradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#4285f4" /><stop offset="33%" stop-color="#9b72cb" /><stop offset="66%" stop-color="#d96570" /><stop offset="100%" stop-color="#fbbc05" /></linearGradient></svg>

    <aside id="sidebar" class="fixed lg:relative top-0 left-0 h-full w-72 bg-white border-r border-zinc-200 p-6 flex flex-col z-40 transition-all duration-300 ease-in-out -translate-x-full lg:translate-x-0">
        <div class="flex items-center justify-between mb-8"><span class="font-beast-logo text-xl font-bold uppercase tracking-widest text-black">HISTORY</span><button onclick="clearUnpinned()" class="text-[10px] font-black text-zinc-400 hover:text-red-600 transition uppercase tracking-tighter">Clear All</button></div>
        <button onclick="startNewChat()" class="flex items-center gap-3 bg-black text-white p-4 rounded-lg text-sm font-bold hover:bg-zinc-800 transition mb-6 shadow-md"><i data-lucide="plus-circle" class="w-5 h-5"></i> New Session</button>
        <nav id="history-list" class="flex-1 space-y-2 overflow-y-auto custom-scrollbar"></nav>
        <button onclick="toggleTheme()" class="mt-4 flex items-center gap-3 w-full p-3 border-2 border-zinc-200 rounded-lg text-xs font-bold uppercase tracking-widest hover:bg-zinc-100 transition text-black"><i data-lucide="moon" id="theme-icon" class="w-4 h-4"></i> <span id="theme-text">Dark Mode</span></button>
        <div class="border-t pt-4 mt-4 text-[10px] text-zinc-400 font-bold tracking-widest text-center uppercase">Beast Core v10.4</div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 bg-zinc-50 relative">
        <header class="flex items-center justify-center px-6 py-5 bg-white border-b-2 border-black shadow-sm z-10 relative"><button onclick="toggleSidebar()" class="absolute left-4 sm:left-6 text-zinc-500 hover:text-black transition-colors z-20"><i data-lucide="menu" class="w-6 h-6"></i></button><h1 class="text-3xl font-black uppercase tracking-[0.25em] text-black font-beast-logo">Beast Ai</h1></header>
        <main id="scroll-container" class="flex-1 overflow-y-auto p-4 sm:p-8 custom-scrollbar"><div class="max-w-3xl mx-auto space-y-8 mt-4"><div id="welcome-box" class="w-full max-w-md mx-auto text-center p-8 border-y border-zinc-300 bg-white text-zinc-600 shadow-sm rounded-lg"><span class="italic text-lg tracking-wide font-medium">Welcome to Beast Ai.<br>Pure, unadulterated intelligence.</span></div><div id="chat-box" class="w-full space-y-10 hidden flex-col"></div></div></main>
        <footer class="bg-white border-t-2 border-black p-4 sm:p-6 z-20"><div class="max-w-3xl mx-auto flex flex-col gap-4"><div class="flex gap-6 px-2"><button id="btn-chat" onclick="setMode('chat')" class="text-xs font-bold uppercase tracking-widest pb-1 border-b-2 border-black text-black">Converse</button><button id="btn-image" onclick="setMode('image')" class="text-xs font-bold uppercase tracking-widest pb-1 border-b-2 border-transparent text-zinc-400 flex items-center gap-1.5"><i data-lucide="image" class="w-3 h-3"></i> Manifest Image</button></div><div id="attachment-preview" class="hidden relative self-start ml-2 mb-2 flex gap-2 overflow-x-auto custom-scrollbar pb-2 max-w-full"></div><div class="relative flex items-end w-full gemini-glow"><button onclick="document.getElementById('file-input').click()" class="absolute left-1 sm:left-2 bottom-1.5 sm:bottom-2 p-2 sm:p-3 text-zinc-500 hover:text-black z-10"><i data-lucide="paperclip" class="w-5 h-5"></i></button><input type="file" id="file-input" class="hidden" accept="image/*,application/pdf" multiple onchange="handleFile(this)"><textarea id="user-input" rows="1" class="w-full bg-white border-2 border-zinc-200 focus:border-zinc-300 p-3 sm:p-4 pl-10 sm:pl-14 pr-12 sm:pr-16 resize-none outline-none font-semibold text-[15px] rounded-lg relative z-0 transition-colors" placeholder="Speak to the Beast..." onkeydown="handleEnter(event)"></textarea><button id="send-btn" onclick="sendMessage()" class="absolute right-1 sm:right-2 bottom-1.5 sm:bottom-2 p-2 sm:p-3 bg-black text-white rounded-md hover:bg-zinc-800 transition z-10"><i data-lucide="send" class="w-5 h-5"></i></button></div></div></footer>
    </div>

    <script>
        lucide.createIcons();
        function toggleTheme() { document.body.classList.toggle('dark'); const isDark = document.body.classList.contains('dark'); localStorage.setItem('beast-theme', isDark ? 'dark' : 'light'); document.getElementById('theme-icon').setAttribute('data-lucide', isDark ? 'sun' : 'moon'); document.getElementById('theme-text').innerText = isDark ? 'Light Mode' : 'Dark Mode'; document.getElementById('theme-color-meta').setAttribute('content', isDark ? '#09090b' : '#fafafa'); lucide.createIcons(); }
        function toggleSidebar() { const sb = document.getElementById('sidebar'); if (window.innerWidth >= 1024) { sb.classList.toggle('desktop-collapsed'); } else { sb.classList.toggle('-translate-x-full'); } }
        function handleEnter(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
        
        // 🚀 Register Service Worker for PWABuilder APK Conversion
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration failed:', err));
        }

        // ... (Maintain loadHistory, compressImage, and other standard functions below) ...
        async function sendMessage() {
            // (Ensure input retrieval and basic DOM updates are intact) ...
            // Re-call your Python fetch logic right here: fetch('/api/chat', { method: 'POST', ... })
        }
    </script>
</body>
</html>
